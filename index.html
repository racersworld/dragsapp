<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14213D">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="RACERS Sign-On">
<title>RACERS Sign-On — Licence Reader</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.1/tesseract.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.2/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{--ink:#14213D;--ink2:#1F2F55;--chrome:#FFC72C;--red:#C8102E;--paper:#F3F4F6;--text:#1B1F24;--muted:#5B6470;--line:#D9DDE3;--ok:#1E8E5A;--okbg:#E4F5EC;--no:#C8102E;--nobg:#FCE8EB;--warn:#B7791F;--warnbg:#FFF4D6;--r:8px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--text);font-family:"Barlow","Helvetica Neue",Arial,sans-serif;font-size:17px;line-height:1.4;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:"Barlow Semi Condensed","Barlow",sans-serif;margin:0;letter-spacing:-.01em}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,select,textarea{font:inherit;width:100%;padding:13px 12px;border:1.5px solid var(--line);border-radius:var(--r);background:#fff;color:var(--text);font-size:17px}
input:focus,select:focus,textarea:focus{outline:3px solid var(--chrome);outline-offset:1px;border-color:var(--ink)}
label{display:block;font-weight:600;font-size:14px;margin:14px 0 6px}
label.inline{display:flex;align-items:center;gap:10px;font-weight:500;font-size:16px;margin:10px 0}
label.inline input{width:22px;height:22px;margin:0}
.hint{color:var(--muted);font-size:13px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:16px 18px;border-radius:var(--r);border:0;font-weight:700;font-size:18px;background:var(--ink);color:#fff}
.btn.chrome{background:var(--chrome);color:var(--ink)}
.btn.ghost{background:#fff;border:1.5px solid var(--line);color:var(--text)}
.btn.ok{background:var(--ok)}.btn.no{background:var(--no)}
.btn.sm{padding:10px 14px;font-size:15px;width:auto}
.btn:disabled{opacity:.45}
.top{position:sticky;top:0;z-index:5;background:#fff;color:var(--text);padding:10px 14px;display:flex;align-items:center;gap:10px;padding-top:max(10px,env(safe-area-inset-top));border-bottom:1px solid var(--line);box-shadow:0 1px 0 rgba(0,0,0,.03)}
.top .b{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.top .b img{height:34px;width:auto;display:block}
.top .b small{font-family:"Barlow";font-weight:600;font-size:13px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top button{background:var(--paper);border:1px solid var(--line);color:var(--text);padding:8px 12px;border-radius:6px;font-weight:700;font-size:14px}
.net{font-size:12px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:6px}
.net i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.net.off i{background:var(--no)}
main{padding:18px 16px 40px;max-width:560px;margin:0 auto}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:14px}
.card h2{font-size:24px;margin-bottom:6px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:14px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-family:"Barlow Semi Condensed";font-size:32px;line-height:1}
.stat span{font-size:12px;color:var(--muted);font-weight:600}
.big{display:grid;gap:10px;margin:14px 0}
.big .btn{padding:22px;font-size:20px}
.step{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-weight:600;margin-bottom:6px}
.prog{height:4px;background:var(--line);border-radius:2px;margin-bottom:16px}
.prog i{display:block;height:100%;background:var(--chrome);border-radius:2px;transition:width .3s}
.imgbox{background:#0b1020;border-radius:12px;aspect-ratio:16/10;display:grid;place-items:center;color:#B9C2D6;overflow:hidden;position:relative}
.imgbox img{width:100%;height:100%;object-fit:contain}
.imgbox .ret{position:absolute;inset:12% 6%;border:2px dashed rgba(255,255,255,.5);border-radius:10px;pointer-events:none}
.imgbox.face{aspect-ratio:4/5;max-width:260px;margin:0 auto}
.ocr{margin-top:10px;font-size:14px;color:var(--muted);display:flex;align-items:center;gap:10px}
.ocr .bar{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}.ocr .bar i{display:block;height:100%;background:var(--ink);width:0}
.flag{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700;margin:4px 4px 0 0}
.flag.ok{background:var(--okbg);color:var(--ok)}.flag.no{background:var(--nobg);color:var(--no)}.flag.warn{background:var(--warnbg);color:var(--warn)}
.alert{padding:12px 14px;border-radius:var(--r);font-weight:600;margin:12px 0;font-size:15px}
.alert.no{background:var(--nobg);color:var(--no)}.alert.warn{background:var(--warnbg);color:#6b4a00}.alert.ok{background:var(--okbg);color:var(--ok)}
.waiver{border:1.5px solid var(--line);border-radius:var(--r);background:#fff;max-height:220px;overflow:auto;padding:12px;font-size:14px;white-space:pre-wrap}
.sig{border:2px solid var(--ink);border-radius:var(--r);background:#fff;touch-action:none;width:100%;height:170px;display:block}
.done{min-height:60vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border-radius:16px;padding:24px;color:#fff}
.done.ok{background:var(--ok)}.done.no{background:var(--no)}
.done h1{font-size:52px;line-height:1}
.done .ic{width:96px;height:96px;border-radius:50%;background:#fff;display:grid;place-items:center;margin-bottom:18px}
.done .ic svg{width:60px;height:60px}
.done ul{text-align:left;background:rgba(0,0,0,.18);border-radius:10px;padding:12px 16px 12px 32px;margin:16px 0 0;font-size:17px;font-weight:600}
.done ul li{margin:4px 0}
.done .id{font-family:ui-monospace,Menlo,monospace;font-size:14px;opacity:.85;margin-top:6px}
.done p{font-size:20px;margin:10px 0 0}
.done small{opacity:.85;font-size:14px}
.list button.rec{display:flex;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:8px;gap:12px;align-items:center}
.list .th{width:44px;height:44px;border-radius:8px;object-fit:cover;background:var(--line);flex:none}
.list .n{font-weight:700}.list .m{font-size:13px;color:var(--muted)}
.list .tag{margin-left:auto;font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--paper);color:var(--muted);flex:none}
.list .tag.p{background:#EEF0FF;color:#3646A0}.list .tag.q{background:var(--warnbg);color:var(--warn)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px}.kv span{color:var(--muted)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:8px;font-weight:600;z-index:9;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1}
.foot{display:flex;gap:10px;margin-top:18px}
.foot .btn{flex:1}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:13px}
</style>
</head>
<body>
<div class="top">
  <div class="b"><img src="logo.png" alt="RACERS"><div><small id="evname">—</small></div></div>
  <div class="net" id="net"><i></i>Online</div>
  <button onclick="nav('records')">Records</button>
  <button onclick="nav('setup')">Setup</button>
</div>
<main id="app"></main>
<div class="toast" id="toast"></div>

<script>
/* ================= storage (IndexedDB) ================= */
const DB={db:null,
  open(){return new Promise((res,rej)=>{const r=indexedDB.open("racers-signon",1);
    r.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains("records"))d.createObjectStore("records",{keyPath:"id"});if(!d.objectStoreNames.contains("kv"))d.createObjectStore("kv");};
    r.onsuccess=e=>{DB.db=e.target.result;res();};r.onerror=e=>rej(e);});},
  tx(store,mode,fn){return new Promise((res,rej)=>{const t=DB.db.transaction(store,mode);const s=t.objectStore(store);const q=fn(s);t.oncomplete=()=>res(q&&q.result!==undefined?q.result:undefined);t.onerror=e=>rej(e);});},
  put(r){return DB.tx("records","readwrite",s=>s.put(r));},
  all(){return DB.tx("records","readonly",s=>s.getAll());},
  get(id){return DB.tx("records","readonly",s=>s.get(id));},
  del(id){return DB.tx("records","readwrite",s=>s.delete(id));},
  setKV(k,v){return DB.tx("kv","readwrite",s=>s.put(v,k));},
  getKV(k){return DB.tx("kv","readonly",s=>s.get(k));}
};

/* ================= settings ================= */
const DEFAULT_WAIVER=`ACKNOWLEDGEMENT OF RISK, RELEASE AND WAIVER

Motorised recreational activities are dangerous and may result in serious injury, death or damage to property.

By signing below I confirm that:
1. I have read and understood this document and I am signing it voluntarily.
2. I hold a current, valid driver licence and I am not disqualified or suspended in any Australian state or territory.
3. I have no medical condition, injury or medication that affects my ability to take part safely.
4. I will not take part under the influence of alcohol or drugs and I agree to testing if requested by an official.
5. I will follow the directions of RACERS and event officials at all times and report any incident immediately.
6. I accept all risks of taking part and, to the full extent permitted by law including the Australian Consumer Law, I release Recreation And Competitive Event Resources & Services Pty Ltd ACN 098 088 610 (RACERS), the Event Organiser, the venue and their officers, employees, contractors, officials and volunteers from all liability for loss, injury or damage arising from my participation.
7. The information I have provided is true and correct.

PRIVACY: RACERS collects your name, contact details, date of birth, driver licence details, an image of your licence and your photograph to record your participation and manage insurance and accreditation for this event. Your information may be provided to the Event Organiser, the venue and RACERS' insurer or broker. It is kept securely for at least seven years. RACERS' privacy policy is at racers.world/privacy.

(Prototype wording — replace with the approved RACERS waiver before use.)`;
let SET={event:"",venue:"",operator:"",device:"",passengerMin:16,guardianUnder:18,waiver:DEFAULT_WAIVER,sbUrl:"",sbKey:"",sbTable:"sign_ons",keepLicenceImage:true};
async function loadSettings(){const s=await DB.getKV("settings");if(s)SET={...SET,...s};if(!SET.device){SET.device="DEV-"+Math.random().toString(36).slice(2,6).toUpperCase();await DB.setKV("settings",SET);}document.getElementById("evname").textContent=SET.event||"No event set";}

/* ================= helpers ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(m,ms=2200){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),ms);}
const uid=()=>Date.now().toString(36).toUpperCase()+"-"+Math.random().toString(36).slice(2,6).toUpperCase();
function fmtDT(iso){const d=new Date(iso);return d.toLocaleDateString("en-AU")+" "+d.toLocaleTimeString("en-AU",{hour:"2-digit",minute:"2-digit"});}
function age(dob){if(!dob)return null;const b=new Date(dob),n=new Date();let a=n.getFullYear()-b.getFullYear();const m=n.getMonth()-b.getMonth();if(m<0||(m===0&&n.getDate()<b.getDate()))a--;return a;}
function fileToImage(file,max){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const sc=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement("canvas");c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",0.82));};im.onerror=rej;im.src=r.result;};r.onerror=rej;r.readAsDataURL(file);});}
function updateNet(){const n=$("#net");n.className="net"+(navigator.onLine?"":" off");n.innerHTML="<i></i>"+(navigator.onLine?"Online":"Offline");}
addEventListener("online",()=>{updateNet();sync();});addEventListener("offline",updateNet);

/* ================= OCR ================= */
// Make a high-contrast greyscale version of the licence photo for the reader.
function preprocess(dataUrl){return new Promise(res=>{const im=new Image();im.onload=()=>{
  const target=1800;const sc=target/Math.max(im.width,im.height);const c=document.createElement("canvas");c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);const x=c.getContext("2d");x.drawImage(im,0,0,c.width,c.height);
  const d=x.getImageData(0,0,c.width,c.height),px=d.data,n=px.length/4;const g=new Uint8ClampedArray(n);
  for(let i=0;i<n;i++)g[i]=(px[i*4]*0.299+px[i*4+1]*0.587+px[i*4+2]*0.114)|0;
  // contrast stretch between 2nd and 98th percentile
  const hist=new Uint32Array(256);for(let i=0;i<n;i++)hist[g[i]]++;let lo=0,hi=255,acc=0;for(let v=0;v<256;v++){acc+=hist[v];if(acc>n*0.02){lo=v;break;}}acc=0;for(let v=255;v>=0;v--){acc+=hist[v];if(acc>n*0.02){hi=v;break;}}const rng=Math.max(1,hi-lo);
  for(let i=0;i<n;i++){let v=((g[i]-lo)*255/rng);v=v<0?0:v>255?255:v;px[i*4]=px[i*4+1]=px[i*4+2]=v;}
  x.putImageData(d,0,0);res(c.toDataURL("image/png"));};im.src=dataUrl;});}
const score=t=>(t.match(/[A-Z0-9]/gi)||[]).length;
async function readLicence(dataUrl){const w=await getWorker();const img=await preprocess(dataUrl);
  await w.setParameters({tessedit_pageseg_mode:"6",preserve_interword_spaces:"1"});let best=(await w.recognize(img)).data.text||"";
  if(score(best)<40){await w.setParameters({tessedit_pageseg_mode:"11"});const t=(await w.recognize(img)).data.text||"";if(score(t)>score(best))best=t;}
  if(score(best)<40){await w.setParameters({tessedit_pageseg_mode:"4"});const t=(await w.recognize(dataUrl)).data.text||"";if(score(t)>score(best))best=t;}
  return best;}
let worker=null,workerReady=null;
function getWorker(){if(!workerReady){workerReady=(async()=>{worker=await Tesseract.createWorker("eng",1,{logger:m=>{if(m.status==="recognizing text"){const b=$("#ocrbar i");if(b)b.style.width=Math.round(m.progress*100)+"%";}}});return worker;})();}return workerReady;}
const MONTHS={JAN:1,FEB:2,MAR:3,APR:4,MAY:5,JUN:6,JUL:7,AUG:8,SEP:9,SEPT:9,OCT:10,NOV:11,DEC:12};
function parseDates(t){const out=[];const re1=/\b(\d{1,2})[\/\-\. ](\d{1,2})[\/\-\. ](\d{4})\b/g;const re2=/\b(\d{1,2})[\s\-\/]?([A-Z]{3,4})[\s\-\/]?(\d{4})\b/gi;let m;
  while((m=re1.exec(t)))out.push(new Date(+m[3],+m[2]-1,+m[1]));
  while((m=re2.exec(t))){const mo=MONTHS[m[2].toUpperCase()];if(mo)out.push(new Date(+m[3],mo-1,+m[1]));}
  return out.filter(d=>!isNaN(d)&&d.getFullYear()>1900&&d.getFullYear()<2100);}
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const STATES=["QLD","NSW","VIC","SA","WA","TAS","ACT","NT"];
const NOISE=/LICEN|DRIVER|DRIVING|QUEENSLAND|NEW SOUTH|VICTORIA|SOUTH AUSTRALIA|WESTERN|TASMANIA|NORTHERN|CAPITAL|AUSTRALIA|EXPIRY|EXPIRES|DATE OF|BIRTH|D\.?O\.?B|CLASS|TYPE|NUMBER|CARD|CONDITIONS|SIGNATURE|HEIGHT|SEX|ADDRESS|NSW|VIC|QLD|TRANSPORT|ROADS|GOVERNMENT|DONOR|PROVISIONAL|PROBATIONARY|LEARNER|HEAVY|EFFECTIVE|ISSUED|ORGAN/i;
function parseLicence(text){
  const T=text.replace(/[|]/g,"I");const lines=T.split(/\n/).map(l=>l.trim()).filter(Boolean);
  const r={first:"",last:"",dob:"",expiry:"",number:"",state:"",cls:"",address:""};
  // state
  const U=T.toUpperCase();
  if(/QUEENSLAND|QLD/.test(U))r.state="QLD";else if(/NEW SOUTH WALES|NSW|SERVICE NSW/.test(U))r.state="NSW";else if(/VICTORIA|VICROADS|VIC\b/.test(U))r.state="VIC";else if(/SOUTH AUSTRALIA|\bSA\b/.test(U))r.state="SA";else if(/WESTERN AUSTRALIA|\bWA\b/.test(U))r.state="WA";else if(/TASMANIA|TAS\b/.test(U))r.state="TAS";else if(/CAPITAL TERRITORY|ACT\b/.test(U))r.state="ACT";else if(/NORTHERN TERRITORY|\bNT\b/.test(U))r.state="NT";
  // dates: earliest = DOB, latest future-ish = expiry
  const ds=parseDates(T).sort((a,b)=>a-b);const now=new Date();
  if(ds.length){const dob=ds.find(d=>now.getFullYear()-d.getFullYear()>=15);if(dob)r.dob=iso(dob);const exp=[...ds].reverse().find(d=>d.getFullYear()>=now.getFullYear()-1&&(!dob||d>dob));if(exp&&exp!==dob)r.expiry=iso(exp);}
  // licence number: labelled first, then by state pattern
  let m=T.match(/(?:LICEN[CS]E\s*(?:NO|NUMBER|#)?|NO\.?|NUMBER)[:\s]*([A-Z0-9]{5,11})/i);
  if(m&&/\d/.test(m[1]))r.number=m[1].toUpperCase();
  if(!r.number){const pat={QLD:/\b\d{8,9}\b/,NSW:/\b\d{8}\b/,VIC:/\b\d{8,10}\b/,SA:/\b[A-Z]\d{6}\b|\b\d{6}\b/,WA:/\b\d{7}\b/,TAS:/\b[A-Z0-9]{6,8}\b/,ACT:/\b\d{7,8}\b/,NT:/\b\d{6,8}\b/}[r.state]||/\b\d{7,10}\b/;
    const cands=(T.match(new RegExp(pat.source,"g"))||[]).filter(c=>!/^(19|20)\d{2}/.test(c)||c.length>4);if(cands.length)r.number=cands[0];}
  // class
  m=U.match(/\b(?:CLASS|TYPE)[:\s]*([A-Z]{1,2}(?:\s?[A-Z]{1,2})?)\b/);if(m)r.cls=m[1].replace(/\s/g,"");
  // name: caps-only alpha lines without noise words, near the top
  const nameLines=lines.filter(l=>/^[A-Z][A-Z' \-]{1,40}$/.test(l)&&!NOISE.test(l)&&l.split(" ").every(w=>w.length>1||w==="'")).slice(0,3);
  if(nameLines.length>=2){r.last=nameLines[0];r.first=nameLines[1];}
  else if(nameLines.length===1){const w=nameLines[0].split(/\s+/);if(w.length>1){r.first=w.slice(0,-1).join(" ");r.last=w[w.length-1];}else r.last=w[0];}
  // address: line with number + words, plus following line with postcode
  const ai=lines.findIndex(l=>/^(?:ADDRESS[:\s]*)?\d+[A-Z]?\s+[A-Z]/i.test(l)&&/\b(ST|RD|AVE?|CT|CR|CRES|DR|PL|LANE|LN|WAY|HWY|PDE|BLVD|CL|TCE|STREET|ROAD|AVENUE|COURT|DRIVE|PLACE|CIRCUIT|PARADE|CLOSE|GROVE|ESP)\b/i.test(l));
  if(ai>=0){r.address=lines[ai].replace(/^ADDRESS[:\s]*/i,"");const nxt=lines[ai+1]||"";if(/\b\d{4}\b/.test(nxt))r.address+=", "+nxt;}
  return r;
}

/* ================= state ================= */
let VIEW="home",R=null,records=[];
function nav(v){VIEW=v;render();window.scrollTo(0,0);}
function newRecord(type){R={id:uid(),type,event:SET.event,venue:SET.venue,operator:SET.operator,device:SET.device,createdAt:new Date().toISOString(),
  first:"",last:"",dob:"",expiry:"",number:"",state:"",cls:"",address:"",phone:"",email:"",
  licenceImg:null,photo:null,sig:null,ocrText:"",guardianName:"",guardianPhone:"",guardianSig:null,
  waiverVersion:SET.waiverVersion||"v1",waiverText:SET.waiver,signedAt:null,result:"",flags:[],synced:false};}

/* ================= render ================= */
async function render(){
  const app=$("#app");
  if(VIEW==="home"){records=await DB.all();const today=new Date().toDateString();const t=records.filter(r=>new Date(r.createdAt).toDateString()===today);const q=records.filter(r=>!r.synced);
    app.innerHTML=`<div class="stats"><div class="stat"><b>${t.filter(r=>r.type==="driver").length}</b><span>Drivers today</span></div><div class="stat"><b>${t.filter(r=>r.type==="passenger").length}</b><span>Passengers today</span></div><div class="stat"><b>${q.length}</b><span>${SET.sbUrl?"Awaiting sync":"On this device"}</span></div></div>
    ${SET.event?"":`<div class="alert warn">Set the event name and operator in Setup before scanning.</div>`}
    <div class="big"><button class="btn chrome" onclick="start('driver')">Sign on a DRIVER</button><button class="btn" onclick="start('passenger')">Sign on a PASSENGER</button></div>
    <div class="card"><h2>How it works</h2><p class="hint">Photograph the driver licence → check the details the reader pulled off it → contact → photo → they sign on the screen → green light. Everything is saved on this phone and synced when there's signal. Works with a physical card or a digital licence on a phone screen.</p><p class="hint">Operator: <b>${esc(SET.operator||"—")}</b> · Device: <b>${esc(SET.device)}</b></p></div>`;}

function wireCapture(){const lf=$("#licfile");if(lf)lf.onchange=async e=>{const f=e.target.files[0];if(!f)return;R.licenceImg=await fileToImage(f,2200);$("#licbox").innerHTML=`<img src="${R.licenceImg}">`;$("#ocr").style.display="flex";
    let cloud=null;
    if(navigator.onLine){try{const ctl=new AbortController();const tm=setTimeout(()=>ctl.abort(),25000);const rs=await fetch("/api/ocr",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({image:R.licenceImg}),signal:ctl.signal});clearTimeout(tm);const j=await rs.json();if(j.ok&&j.fields)cloud=j;else console.warn("cloud reader",j.error);}catch(e){console.warn("cloud reader",e);}}
    if(cloud){const f=cloud.fields;["first","last","dob","expiry","number","state","cls","address"].forEach(k=>{if(f[k])R[k]=String(f[k]).trim();});R.first=R.first.toUpperCase();R.last=R.last.toUpperCase();R.ocrText="RACERS reader ("+(f.confidence||"?")+" confidence"+(f.digital?", digital licence":"")+")"+(f.notes?"\nCheck: "+f.notes:"");R.ocrSource="cloud";if(f.confidence==="low")toast("Low confidence read — check every field",4000);else if(f.notes)toast("Check: "+f.notes,4000);}
    else{try{const text=await readLicence(R.licenceImg);R.ocrText=text;R.ocrSource="device";Object.assign(R,Object.fromEntries(Object.entries(parseLicence(text)).filter(([k,v])=>v)));toast(navigator.onLine?"Cloud reader unavailable — used on-device reader, check every field":"Offline — used on-device reader, check every field",4000);}catch(err){console.error(err);toast("Reader failed — type the details in");}}
    STEP=1;render();};
  const ff=$("#facefile");if(ff)ff.onchange=async e=>{const f=e.target.files[0];if(!f)return;R.photo=await fileToImage(f,900);render();};}
function cancelCap(){if(confirm("Cancel this sign-on?"))nav("home");}
function checks(){const fl=[];const a=age(R.dob);const now=new Date();
  if(!R.number)fl.push({k:"warn",t:"No licence number"});
  if(R.expiry){if(new Date(R.expiry)<now)fl.push({k:"no",t:"Licence expired"});else fl.push({k:"ok",t:"Licence current"});}else fl.push({k:"warn",t:"No expiry read"});
  if(a===null)fl.push({k:"warn",t:"No date of birth"});else{if(R.type==="passenger"&&a<SET.passengerMin)fl.push({k:"no",t:`Under ${SET.passengerMin} — refuse`});else if(a<SET.guardianUnder)fl.push({k:"warn",t:`Under ${SET.guardianUnder} — guardian required`});else fl.push({k:"ok",t:`Age ${a}`});}
  if(/^L/i.test(R.cls))fl.push({k:"no",t:"Learner licence"});if(/^P/i.test(R.cls))fl.push({k:"warn",t:"Provisional"});
  return fl;}
function saveConfirm(){R.first=$("#f_first").value.trim().toUpperCase();R.last=$("#f_last").value.trim().toUpperCase();R.dob=$("#f_dob").value;R.expiry=$("#f_exp").value;R.number=$("#f_num").value.trim().toUpperCase();R.state=$("#f_state").value;R.cls=$("#f_cls").value.trim().toUpperCase();R.address=$("#f_addr").value.trim();
  if(!R.first||!R.last||!R.dob){toast("Name and date of birth are required");return;}

  if(hard.length){if(confirm(hard.map(f=>f.t).join("\n")+"\n\nRecord as REFUSED?")){R.result="refused";R.signedAt=null;DB.put(R).then(()=>{STEP=5;render();sync();});}return;}

function saveContact(){R.phone=$("#f_phone").value.trim();R.email=$("#f_email").value.trim();const g=$("#f_gname");if(g){R.guardianName=g.value.trim();R.guardianPhone=$("#f_gphone").value.trim();if(!R.guardianName){toast("Guardian name required");return;}}

const PADS={};
function initSig(id){const c=document.getElementById(id);if(!c)return;const dpr=window.devicePixelRatio||1;c.width=c.clientWidth*dpr;c.height=c.clientHeight*dpr;const x=c.getContext("2d");x.scale(dpr,dpr);x.lineWidth=2.4;x.lineCap="round";x.lineJoin="round";x.strokeStyle="#14213D";let d=false,used=false;const pt=e=>{const r=c.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top];};
  c.onpointerdown=e=>{d=true;used=true;c.setPointerCapture(e.pointerId);x.beginPath();x.moveTo(...pt(e));};c.onpointermove=e=>{if(!d)return;x.lineTo(...pt(e));x.stroke();};c.onpointerup=c.onpointercancel=()=>{d=false;};
  PADS[id]={c,x,get used(){return used;},reset(){used=false;}};}
function clearSig(id){const p=PADS[id];if(!p)return;p.x.clearRect(0,0,p.c.width,p.c.height);p.reset();}
async function finish(){const s=PADS.sig;if(!s||!s.used){toast("Signature required");return;}R.sig=s.c.toDataURL("image/png");const g=PADS.gsig;if(g){if(!g.used){toast("Guardian signature required");return;}R.guardianSig=g.c.toDataURL("image/png");}
  if(!SET.keepLicenceImage)R.licenceImg=null;R.signedAt=new Date().toISOString();R.result="signed";R.waiverText=SET.waiver;R.waiverVersion=SET.waiverVersion||"v1";
  await DB.put(R);STEP=5;render();sync();}

function buildPDF(r){const {jsPDF}=window.jspdf;const d=new jsPDF({unit:"mm",format:"a4"});const W=210;let y=14;
  d.setFillColor(255);d.rect(0,0,W,24,"F");if(LOGO){try{d.addImage(LOGO,"PNG",10,5,40,10.6);}catch(e){}}else{d.setTextColor(200,16,46);d.setFont("helvetica","bold");d.setFontSize(16);d.text("RACERS",12,14);}d.setTextColor(20,33,61);d.setFontSize(10);d.setFont("helvetica","bold");d.text((r.type==="passenger"?"PASSENGER":"DRIVER")+" SIGN-ON · "+(r.event||""),56,14);d.setFont("helvetica","normal");d.text(r.id,W-12,14,{align:"right"});d.setDrawColor(200,16,46);d.setLineWidth(1);d.line(0,24,W,24);d.setLineWidth(.2);
  y=32;d.setTextColor(0);d.setFont("helvetica","bold");d.setFontSize(18);d.text(`${r.first} ${r.last}`,12,y);y+=8;
  d.setFont("helvetica","normal");d.setFontSize(10);
  const kv=[["Date of birth",r.dob+(age(r.dob)!==null?` (age ${age(r.dob)})`:"")],["Licence",`${r.number||"—"}  ${r.state||""}  ${r.cls?"class "+r.cls:""}`],["Licence expiry",r.expiry||"—"],["Address",r.address||"—"],["Mobile",r.phone||"—"],["Email",r.email||"—"],["Event / venue",`${r.event||""} · ${r.venue||""}`],["Signed",r.signedAt?fmtDT(r.signedAt):"NOT SIGNED — "+r.result],["Witnessed by",`${r.operator||"—"} · device ${r.device}`],["Waiver version",r.waiverVersion||"v1"]];

  let iy=32;if(r.photo){try{d.addImage(r.photo,"JPEG",150,iy,40,50);}catch(e){}iy+=54;}if(r.licenceImg){try{d.addImage(r.licenceImg,"JPEG",140,iy,58,36);}catch(e){}}
  y=Math.max(y,iy+40)+4;d.setDrawColor(200);d.line(12,y,W-12,y);y+=6;
  d.setFontSize(8.5);const lines=d.splitTextToSize(r.waiverText||"",W-24);lines.forEach(l=>{if(y>262){d.addPage();y=16;}d.text(l,12,y);y+=3.7;});
  y+=6;if(y>230){d.addPage();y=16;}
  d.setFontSize(10);d.text(`Signature: ${r.first} ${r.last}`,12,y);if(r.sig){try{d.addImage(r.sig,"PNG",12,y+2,70,26);}catch(e){}}
  if(r.guardianSig){d.text(`Signature: ${r.guardianName} (parent/guardian)`,110,y);try{d.addImage(r.guardianSig,"PNG",110,y+2,70,26);}catch(e){}}
  y+=32;d.setTextColor(120);d.setFontSize(8);d.text(`Record ${r.id} · created ${fmtDT(r.createdAt)} · Recreation And Competitive Event Resources & Services Pty Ltd ACN 098 088 610`,12,y);
  return d;}
async function viewPDF(id){const r=await DB.get(id);const d=buildPDF(r);d.save(`${r.event||"event"}_${r.last}_${r.first}_${r.id}.pdf`.replace(/\s+/g,"_"));}
async function exportCSV(){const rs=await DB.all();const H=["id","type","event","venue","first","last","dob","age","licence_number","state","class","expiry","address","phone","email","guardian_name","guardian_phone","result","signed_at","waiver_version","operator","device","created_at","synced"];
  const rows=[H,...rs.map(r=>[r.id,r.type,r.event,r.venue,r.first,r.last,r.dob,age(r.dob)??"",r.number,r.state,r.cls,r.expiry,r.address,r.phone,r.email,r.guardianName,r.guardianPhone,r.result,r.signedAt||"",r.waiverVersion,r.operator,r.device,r.createdAt,r.synced])];
  dl(new Blob([rows.map(x=>x.map(v=>`"${String(v??"").replace(/"/g,'""')}"`).join(",")).join("\n")],{type:"text/csv"}),`${SET.event||"signon"}_register.csv`.replace(/\s+/g,"_"));}
async function exportZip(){const rs=await DB.all();if(!rs.length){toast("Nothing to export");return;}toast("Building PDFs…",8000);const z=new JSZip();for(const r of rs){z.file(`${r.last}_${r.first}_${r.id}.pdf`.replace(/\s+/g,"_"),buildPDF(r).output("blob"));}
  z.file("register.csv",(await (async()=>{const H=["id","type","first","last","dob","licence_number","state","expiry","phone","email","result","signed_at"];return [H,...rs.map(r=>[r.id,r.type,r.first,r.last,r.dob,r.number,r.state,r.expiry,r.phone,r.email,r.result,r.signedAt||""])].map(x=>x.map(v=>`"${String(v??"").replace(/"/g,'""')}"`).join(",")).join("\n");})()));
  dl(await z.generateAsync({type:"blob"}),`${SET.event||"signon"}_waivers.zip`.replace(/\s+/g,"_"));}
function dl(blob,name){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();}

/* ================= sync (Supabase REST) ================= */
const SQL=`create table if not exists sign_ons (
  id text primary key,
  type text, event text, venue text,
  first_name text, last_name text, dob date, licence_number text, state text, class text, expiry date, address text,
  phone text, email text, guardian_name text, guardian_phone text,
  result text, signed_at timestamptz, waiver_version text, waiver_text text,
  operator text, device text, created_at timestamptz,
  licence_img text, photo text, sig text, guardian_sig text, ocr_text text
);
alter table sign_ons enable row level security;
create policy "insert from devices" on sign_ons for insert to anon with check (true);
-- reads only via service role / dashboard`;
let syncing=false;
async function sync(force){if(!SET.sbUrl||!SET.sbKey||!navigator.onLine||syncing)return;syncing=true;let n=0;
  try{const rs=(await DB.all()).filter(r=>!r.synced);for(const r of rs){const body={id:r.id,type:r.type,event:r.event,venue:r.venue,first_name:r.first,last_name:r.last,dob:r.dob||null,licence_number:r.number,state:r.state,class:r.cls,expiry:r.expiry||null,address:r.address,phone:r.phone,email:r.email,guardian_name:r.guardianName,guardian_phone:r.guardianPhone,result:r.result,signed_at:r.signedAt,waiver_version:r.waiverVersion,waiver_text:r.waiverText,operator:r.operator,device:r.device,created_at:r.createdAt,licence_img:r.licenceImg,photo:r.photo,sig:r.sig,guardian_sig:r.guardianSig,ocr_text:r.ocrText};
      const res=await fetch(`${SET.sbUrl}/rest/v1/${SET.sbTable}`,{method:"POST",headers:{"Content-Type":"application/json",apikey:SET.sbKey,Authorization:"Bearer "+SET.sbKey,Prefer:"resolution=merge-duplicates"},body:JSON.stringify(body)});
      if(res.ok||res.status===409){r.synced=true;await DB.put(r);n++;}else{console.error("sync",res.status,await res.text());break;}}
    if(n||force)toast(n?`Synced ${n}`:"Nothing to sync");if(VIEW==="home"||VIEW==="records")render();}
  catch(e){console.error(e);if(force)toast("Sync failed — still on device");}finally{syncing=false;}}

/* ================= boot ================= */
(async()=>{await DB.open();await loadSettings();render();setInterval(sync,60000);})();
</script>
