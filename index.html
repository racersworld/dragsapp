<style>
:root{--orange:#E8891D;--ink:#14213D;--ink2:#1F2F55;--chrome:#FFC72C;--paper:#F3F4F6;--text:#1B1F24;--muted:#5B6470;--line:#D9DDE3;--ok:#1E8E5A;--okbg:#E4F5EC;--no:#C8102E;--nobg:#FCE8EB;--warn:#B7791F;--warnbg:#FFF4D6;--r:8px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--text);font-family:"Barlow","Helvetica Neue",Arial,sans-serif;font-size:17px;line-height:1.4;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:"Barlow Semi Condensed","Barlow",sans-serif;margin:0;letter-spacing:-.01em}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,select,textarea{font:inherit;width:100%;padding:13px 12px;border:1.5px solid var(--line);border-radius:var(--r);background:#fff;color:var(--text);font-size:17px}
input:focus,select:focus,textarea:focus{outline:3px solid var(--chrome);outline-offset:1px;border-color:var(--ink)}
label{display:block;font-weight:600;font-size:14px;margin:14px 0 6px}
label.inline{display:flex;align-items:center;gap:10px;font-weight:500;font-size:16px;margin:10px 0}
label.inline input{width:22px;height:22px;margin:0}
.hint{color:var(--muted);font-size:13px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:16px 18px;border-radius:var(--r);border:0;font-weight:700;font-size:18px;background:var(--ink);color:#fff}
.btn.chrome{background:var(--chrome);color:var(--ink)}.btn.ghost{background:#fff;border:1.5px solid var(--line);color:var(--text)}
.btn.ok{background:var(--ok)}.btn.no{background:var(--no)}.btn.sm{padding:10px 14px;font-size:15px;width:auto}.btn:disabled{opacity:.45}
.top{position:sticky;top:0;z-index:5;background:#fff;color:var(--text);padding:10px 14px;display:flex;align-items:center;gap:10px;padding-top:max(10px,env(safe-area-inset-top));border-bottom:1px solid var(--line)}
.top .b{display:flex;align-items:center;gap:10px;flex:1;min-width:0}.top .b img{height:34px;width:auto;display:block}
.top .b small{font-weight:600;font-size:13px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top button{background:var(--paper);border:1px solid var(--line);color:var(--text);padding:8px 12px;border-radius:6px;font-weight:700;font-size:14px}
.net{font-size:12px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:6px}.net i{width:8px;height:8px;border-radius:50%;background:var(--ok)}.net.off i{background:var(--no)}
main{padding:18px 16px 40px;max-width:560px;margin:0 auto}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:14px}.card h2{font-size:24px;margin-bottom:6px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:14px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}.stat b{display:block;font-family:"Barlow Semi Condensed";font-size:32px;line-height:1}.stat span{font-size:12px;color:var(--muted);font-weight:600}
.big{display:grid;gap:10px;margin:14px 0}.big .btn{padding:22px;font-size:20px}
.step{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-weight:600;margin-bottom:6px}
.prog{height:4px;background:var(--line);border-radius:2px;margin-bottom:16px}.prog i{display:block;height:100%;background:var(--chrome);border-radius:2px;transition:width .3s}
.imgbox{background:#0b1020;border-radius:12px;aspect-ratio:16/10;display:grid;place-items:center;color:#B9C2D6;overflow:hidden;position:relative;text-align:center}
.imgbox img,.imgbox video{width:100%;height:100%;object-fit:contain}.imgbox video{object-fit:cover}
.imgbox .ret{position:absolute;inset:12% 6%;border:2px dashed rgba(255,255,255,.5);border-radius:10px;pointer-events:none}
.imgbox.face{aspect-ratio:4/5;max-width:260px;margin:0 auto}.imgbox.sq{aspect-ratio:1/1}
.ocr{margin-top:10px;font-size:14px;color:var(--muted);display:flex;align-items:center;gap:10px}.ocr .bar{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}.ocr .bar i{display:block;height:100%;background:var(--ink);width:0;animation:ld 1.4s infinite}
@keyframes ld{0%{width:0}50%{width:80%}100%{width:0}}
.flag{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700;margin:4px 4px 0 0}.flag.ok{background:var(--okbg);color:var(--ok)}.flag.no{background:var(--nobg);color:var(--no)}.flag.warn{background:var(--warnbg);color:var(--warn)}
.alert{padding:12px 14px;border-radius:var(--r);font-weight:600;margin:12px 0;font-size:15px}.alert.no{background:var(--nobg);color:var(--no)}.alert.warn{background:var(--warnbg);color:#6b4a00}.alert.ok{background:var(--okbg);color:var(--ok)}
.waiver{border:1.5px solid var(--line);border-radius:var(--r);background:#fff;max-height:220px;overflow:auto;padding:12px;font-size:14px;white-space:pre-wrap}
.sig{border:2px solid var(--ink);border-radius:var(--r);background:#fff;touch-action:none;width:100%;height:170px;display:block}
.done{min-height:60vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border-radius:16px;padding:24px;color:#fff}
.done.ok{background:var(--ok)}.done.no{background:var(--no)}.done.pend{background:var(--orange)}
.shot{background:#fff;color:var(--no);border:4px solid var(--no);border-radius:12px;padding:12px 14px;margin:0 0 14px;font-family:"Barlow Semi Condensed";font-weight:800;font-size:26px;line-height:1.1;text-align:center;animation:pulse 1.2s ease-in-out infinite}.shot small{display:block;font-family:"Barlow";font-weight:600;font-size:15px;color:var(--text);margin-top:4px}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}@media (prefers-reduced-motion:reduce){.shot{animation:none}}
.used{background:var(--no);color:#fff;border-radius:12px;padding:16px;margin-bottom:14px;text-align:center}.used h2{font-size:30px;color:#fff}.used p{margin:6px 0 0;font-weight:600}
.done h1{font-size:48px;line-height:1}.done p{font-size:20px;margin:10px 0 0}.done small{opacity:.85;font-size:14px}
.done .ic{width:96px;height:96px;border-radius:50%;background:#fff;display:grid;place-items:center;margin-bottom:18px}.done .ic svg{width:60px;height:60px}
.done ul{text-align:left;background:rgba(0,0,0,.18);border-radius:10px;padding:12px 16px 12px 32px;margin:16px 0 0;font-size:17px;font-weight:600}.done .id{font-family:ui-monospace,Menlo,monospace;font-size:14px;opacity:.85;margin-top:6px}
.qrwrap{background:#fff;border-radius:14px;padding:18px;margin-top:16px;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--text)}
.qrwrap .code img,.qrwrap .code canvas{width:200px!important;height:200px!important}
.list button.rec{display:flex;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:8px;gap:12px;align-items:center}
.th{width:44px;height:44px;border-radius:8px;object-fit:cover;background:var(--line);flex:none;display:inline-grid;place-items:center;font-weight:700;color:var(--muted)}
.list .n{font-weight:700}.list .m{font-size:13px;color:var(--muted)}
.tag{font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--paper);color:var(--muted);flex:none}.tag.p{background:#EEF0FF;color:#3646A0}.tag.q{background:var(--warnbg);color:var(--warn)}.tag.ok{background:var(--okbg);color:var(--ok)}.tag.no{background:var(--nobg);color:var(--no)}
.list .tag{margin-left:auto}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px}.kv span{color:var(--muted)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:8px;font-weight:600;z-index:9;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;text-align:center}.toast.show{opacity:1}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:13px}
.approve{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bigphoto{width:100%;max-width:300px;aspect-ratio:4/5;object-fit:cover;border-radius:12px;background:var(--line);display:block;margin:0 auto 12px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
.helpbar{position:sticky;top:56px;z-index:4;background:var(--no);color:#fff;padding:12px 16px;box-shadow:0 6px 20px rgba(200,16,46,.35)}.helpbar .in{max-width:560px;margin:0 auto}.helpbar h3{font-size:20px;color:#fff}.helpbar .r{background:rgba(255,255,255,.14);border-radius:8px;padding:10px 12px;margin-top:8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.helpbar .r b{font-size:16px}.helpbar .r small{display:block;opacity:.9}.helpbar .btn{width:auto;padding:8px 12px;font-size:14px;background:#fff;color:var(--no)}
.kiosk main{max-width:760px;font-size:19px}.kiosk .btn{font-size:22px;padding:20px}.kiosk .top button{display:none}
</style>
</head>
<body>
<div class="top"><div class="b"><img src="logo.png" alt="RACERS" id="logo"><div><small id="evname">—</small></div></div><div class="net" id="net"><i></i>Online</div><span id="topbtns"></span></div>
<div id="helpbar"></div>
<main id="app"></main>
<div class="toast" id="toast"></div>
<script>
/* ============ mode & storage ============ */
const Q=new URLSearchParams(location.search);
const MODE=Q.get("kiosk")?"kiosk":Q.get("e")?"self":"staff";const INVITE=Q.get("invite")||"";
const PUBCODE=(Q.get("kiosk")||Q.get("e")||"").toUpperCase();
if(MODE==="kiosk")document.body.classList.add("kiosk");
const DB={db:null,opening:null,
  open(){if(DB.db)return Promise.resolve();if(DB.opening)return DB.opening;DB.opening=new Promise((res,rej)=>{const r=indexedDB.open("racers-signon-v2",1);r.onupgradeneeded=e=>{const d=e.target.result;["records","manifest","kv","approvals"].forEach(n=>{if(!d.objectStoreNames.contains(n))d.createObjectStore(n,n==="kv"?undefined:{keyPath:"id"});});};r.onsuccess=e=>{DB.db=e.target.result;DB.db.onclose=()=>{DB.db=null;};DB.db.onversionchange=()=>{try{DB.db.close();}catch{}DB.db=null;};DB.opening=null;res();};r.onerror=e=>{DB.opening=null;rej(e);};});return DB.opening;},
  async tx(st,mode,fn,retry=true){await DB.open();try{return await new Promise((res,rej)=>{const t=DB.db.transaction(st,mode);const q=fn(t.objectStore(st));t.oncomplete=()=>res(q&&q.result!==undefined?q.result:undefined);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);});}catch(e){if(retry&&/clos|InvalidState/i.test(String(e&&e.message||e))){DB.db=null;return DB.tx(st,mode,fn,false);}throw e;}},
  put:(st,r)=>DB.tx(st,"readwrite",s=>s.put(r)),all:st=>DB.tx(st,"readonly",s=>s.getAll()),get:(st,id)=>DB.tx(st,"readonly",s=>s.get(id)),del:(st,id)=>DB.tx(st,"readwrite",s=>s.delete(id)),clear:st=>DB.tx(st,"readwrite",s=>s.clear()),
  setKV:(k,v)=>DB.tx("kv","readwrite",s=>s.put(v,k)),getKV:k=>DB.tx("kv","readonly",s=>s.get(k))};
const $=s=>document.querySelector(s);const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(m,ms=2400){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),ms);}
const uid=()=>Date.now().toString(36).toUpperCase()+"-"+Math.random().toString(36).slice(2,6).toUpperCase();
const fmtDT=iso=>{if(!iso)return"";const d=new Date(iso);return d.toLocaleDateString("en-AU")+" "+d.toLocaleTimeString("en-AU",{hour:"2-digit",minute:"2-digit"});};
const fmtT=iso=>iso?new Date(iso).toLocaleTimeString("en-AU",{hour:"2-digit",minute:"2-digit"}):"";
function age(dob){if(!dob)return null;const b=new Date(dob),n=new Date();let a=n.getFullYear()-b.getFullYear();const m=n.getMonth()-b.getMonth();if(m<0||(m===0&&n.getDate()<b.getDate()))a--;return a;}
function fileToImage(file,max){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const sc=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement("canvas");c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",0.82));};im.onerror=rej;im.src=r.result;};r.onerror=rej;r.readAsDataURL(file);});}
async function pdfToImage(file){if(!window.pdfjsLib)throw new Error("PDF reader not loaded");pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";const buf=await file.arrayBuffer();const pdf=await pdfjsLib.getDocument({data:buf}).promise;const page=await pdf.getPage(1);const vp=page.getViewport({scale:2});const c=document.createElement("canvas");c.width=vp.width;c.height=vp.height;await page.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;return c.toDataURL("image/jpeg",0.85);}
async function anyToImage(file,max){if(file.type==="application/pdf"||/\.pdf$/i.test(file.name)){const d=await pdfToImage(file);const blob=await (await fetch(d)).blob();return fileToImage(blob,max);}return fileToImage(file,max);}
function cropData(dataUrl,b){return new Promise(res=>{if(!b||!(b.w>0)||!(b.h>0)){res(null);return;}const im=new Image();im.onload=()=>{const pad=0.12;let x=(b.x-b.w*pad)*im.width,y=(b.y-b.h*pad)*im.height,w=b.w*(1+2*pad)*im.width,h=b.h*(1+2*pad)*im.height;x=Math.max(0,x);y=Math.max(0,y);w=Math.min(im.width-x,w);h=Math.min(im.height-y,h);if(w<40||h<40){res(null);return;}const sc=Math.min(1,600/Math.max(w,h));const c=document.createElement("canvas");c.width=Math.round(w*sc);c.height=Math.round(h*sc);c.getContext("2d").drawImage(im,x,y,w,h,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",0.85));};im.onerror=()=>res(null);im.src=dataUrl;});}
async function urlToData(url){try{const b=await (await fetch(url)).blob();return await new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b);});}catch{return null;}}
function updateNet(){const n=$("#net");n.className="net"+(navigator.onLine?"":" off");n.innerHTML="<i></i>"+(navigator.onLine?"Online":"Offline");}
addEventListener("online",()=>{updateNet();sync();});addEventListener("offline",updateNet);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"){DB.open().catch(()=>{});updateNet();}});

/* ============ config, auth, api ============ */
let CFG={supabaseUrl:"",anonKey:"",ocr:false,ocrOwner:""},SESSION=null,ME=null,EVENTS=[],EV=null,SET={device:""};
async function loadConfig(){try{const c=await (await fetch("/api/config",{cache:"no-store"})).json();CFG=c;await DB.setKV("cfg",c);}catch{const c=await DB.getKV("cfg");if(c)CFG=c;}}
async function login(email,password){const r=await fetch(`${CFG.supabaseUrl}/auth/v1/token?grant_type=password`,{method:"POST",headers:{apikey:CFG.anonKey,"Content-Type":"application/json"},body:JSON.stringify({email,password})});const j=await r.json();if(!r.ok)throw new Error(j.error_description||j.msg||"Login failed");SESSION={access_token:j.access_token,refresh_token:j.refresh_token,expires_at:Date.now()+j.expires_in*1000};await DB.setKV("session",SESSION);}
async function refreshSession(){if(!SESSION||!navigator.onLine)return;if(Date.now()<SESSION.expires_at-60000)return;try{const r=await fetch(`${CFG.supabaseUrl}/auth/v1/token?grant_type=refresh_token`,{method:"POST",headers:{apikey:CFG.anonKey,"Content-Type":"application/json"},body:JSON.stringify({refresh_token:SESSION.refresh_token})});const j=await r.json();if(r.ok){SESSION={access_token:j.access_token,refresh_token:j.refresh_token,expires_at:Date.now()+j.expires_in*1000};await DB.setKV("session",SESSION);}else if(r.status===400){await logout(false);}}catch{}}
async function logout(render_=true){SESSION=null;ME=null;await DB.setKV("session",null);await DB.setKV("me",null);if(render_){VIEW="login";render();}}
async function api(path,opts={}){await refreshSession();const h={"Content-Type":"application/json",...(opts.headers||{})};if(SESSION)h.Authorization="Bearer "+SESSION.access_token;const r=await fetch(path,{...opts,headers:h,body:opts.body?JSON.stringify(opts.body):undefined});const j=await r.json().catch(()=>({ok:false,error:"bad response"}));if(r.status===401&&SESSION&&!opts._retried){SESSION.expires_at=0;await refreshSession();if(SESSION)return api(path,{...opts,_retried:true});}if(!r.ok||!j.ok)throw new Error(j.error||("HTTP "+r.status));return j;}
const rank={event_staff:1,event_admin:2,admin:3,super_admin:4,god:5};const ROLES=Object.keys(rank);const roleName=r=>r==="god"?"God":r.replace("_"," ");const SCOPED=r=>r==="event_staff"||r==="event_admin";const can=r=>ME&&rank[ME.role]>=rank[r];

/* ============ OCR (cloud first, device fallback) ============ */
let worker=null,workerReady=null;
function getWorker(){if(!workerReady){workerReady=(async()=>{worker=await Tesseract.createWorker("eng",1,{});return worker;})();}return workerReady;}
function preprocess(dataUrl){return new Promise(res=>{const im=new Image();im.onload=()=>{const sc=1800/Math.max(im.width,im.height);const c=document.createElement("canvas");c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);const x=c.getContext("2d");x.drawImage(im,0,0,c.width,c.height);x.filter="grayscale(1) contrast(1.4)";x.drawImage(c,0,0);res(c.toDataURL("image/png"));};im.src=dataUrl;});}
const score=t=>(t.match(/[A-Z0-9]/gi)||[]).length;
async function deviceOCR(dataUrl){const w=await getWorker();await w.setParameters({tessedit_pageseg_mode:"6"});return (await w.recognize(await preprocess(dataUrl))).data.text||"";}
const MONTHS={JAN:1,FEB:2,MAR:3,APR:4,MAY:5,JUN:6,JUL:7,AUG:8,SEP:9,SEPT:9,OCT:10,NOV:11,DEC:12};const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
function parseLicence(text){const T=text.replace(/[|]/g,"I");const U=T.toUpperCase();const r={};if(/QUEENSLAND|QLD/.test(U))r.state="QLD";else if(/NEW SOUTH WALES|NSW/.test(U))r.state="NSW";else if(/VICTORIA|VICROADS/.test(U))r.state="VIC";else if(/SOUTH AUSTRALIA/.test(U))r.state="SA";else if(/WESTERN AUSTRALIA/.test(U))r.state="WA";else if(/TASMANIA/.test(U))r.state="TAS";else if(/CAPITAL TERRITORY/.test(U))r.state="ACT";else if(/NORTHERN TERRITORY/.test(U))r.state="NT";
  const ds=[];let m;const re1=/\b(\d{1,2})[\/\-\. ](\d{1,2})[\/\-\. ](\d{4})\b/g,re2=/\b(\d{1,2})[\s\-\/]?([A-Z]{3,4})[\s\-\/]?(\d{4})\b/gi;while((m=re1.exec(T)))ds.push(new Date(+m[3],+m[2]-1,+m[1]));while((m=re2.exec(T))){const mo=MONTHS[m[2].toUpperCase()];if(mo)ds.push(new Date(+m[3],mo-1,+m[1]));}
  const now=new Date();const v=ds.filter(d=>!isNaN(d)&&d.getFullYear()>1900).sort((a,b)=>a-b);const dob=v.find(d=>now.getFullYear()-d.getFullYear()>=15);if(dob)r.dob=iso(dob);const exp=[...v].reverse().find(d=>d.getFullYear()>=now.getFullYear()-1&&(!dob||d>dob));if(exp)r.expiry=iso(exp);
  m=T.match(/(?:LICEN[CS]E\s*(?:NO|NUMBER|#)?|NO\.?|NUMBER)[:\s]*([A-Z0-9]{5,11})/i);if(m&&/\d/.test(m[1]))r.number=m[1].toUpperCase();else{const c=(T.match(/\b\d{7,10}\b/g)||[]);if(c.length)r.number=c[0];}

const PADS={};function initSig(id){const c=document.getElementById(id);if(!c)return;const dpr=devicePixelRatio||1;c.width=c.clientWidth*dpr;c.height=c.clientHeight*dpr;const x=c.getContext("2d");x.scale(dpr,dpr);x.lineWidth=2.4;x.lineCap="round";x.lineJoin="round";x.strokeStyle="#14213D";let d=false,used=false;const pt=e=>{const r=c.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top];};c.onpointerdown=e=>{d=true;used=true;c.setPointerCapture(e.pointerId);x.beginPath();x.moveTo(...pt(e));};c.onpointermove=e=>{if(!d)return;x.lineTo(...pt(e));x.stroke();};c.onpointerup=c.onpointercancel=()=>{d=false;};PADS[id]={c,x,get used(){return used;},reset(){used=false;}};}

let syncing=false;
async function sync(force){if(!navigator.onLine||syncing)return;syncing=true;let n=0;try{
  for(const r of (await DB.all("records")).filter(x=>!x.synced)){try{const j=await submitRecord(r);r.synced=true;r.qr_token=j.qr_token;await DB.put("records",r);n++;}catch(e){console.warn("sync",e.message);if(/Login/.test(e.message))break;}}
  for(const a of await DB.all("approvals")){try{await api("/api/approve",{method:"POST",body:a});await DB.del("approvals",a.id);n++;}catch(e){console.warn("approval",e.message);}}
  records=await DB.all("records");if(MODE==="staff"&&ME&&EV)await syncManifest();
  if(force||n)toast(n?`Synced ${n}`:"Up to date");if(["home","records"].includes(VIEW))render();}catch(e){if(force)toast("Sync failed");}finally{syncing=false;}}
async function syncManifest(){if(!EV||!navigator.onLine||!SESSION)return;try{const since=await DB.getKV("manifest_since_"+EV.id);const j=await api(`/api/manifest?event=${EV.id}${since?"&since="+encodeURIComponent(since):""}`);

    const tick=async()=>{if(VIEW!=="scan")return;if(v.readyState===4&&!busy){busy=true;try{if(window.jsQR){c.width=v.videoWidth;c.height=v.videoHeight;x.drawImage(v,0,0);const d=x.getImageData(0,0,c.width,c.height);const q=jsQR(d.data,c.width,c.height,{inversionAttempts:"dontInvert"});if(q&&q.data){onCode(q.data);return;}}else if(det){const codes=await det.detect(v);if(codes.length&&codes[0].rawValue){onCode(codes[0].rawValue);return;}}}catch(e){}busy=false;}scanRAF=requestAnimationFrame(tick);};tick();}catch(e){toast("Camera not available — type the code");}}
function stopScan(){if(scanRAF)cancelAnimationFrame(scanRAF);scanRAF=null;if(scanStream){scanStream.getTracks().forEach(t=>t.stop());scanStream=null;}}
async function onCode(data){stopScan();const tok=String(data).replace(/^RACERS:/,"").trim();let m=manifest.find(x=>x.qr_token===tok);
  if(!m&&navigator.onLine){try{const j=await api(`/api/records?qr=${encodeURIComponent(tok)}`);m=j.record;}catch(e){}}
  if(!m){toast("Not found on this device — do a full sign-on",4000);nav("home");return;}R=m;nav("approve");}

async function decide(action){const id=R.id;let reason=null,band_no=null;if(action==="refuse"){reason=prompt("Reason for refusal:","Photo does not match")||"Refused at gate";if(!reason)return;}
  if(action==="replace"){reason=prompt("Why is the band being replaced?\n1. Lost\n2. Stolen\n3. Damaged\n4. Other\n\nType a number or your own words:");if(reason===null)return;reason=({"1":"Lost","2":"Stolen","3":"Damaged","4":"Other"})[reason.trim()]||reason.trim()||"Replaced";band_no=prompt("New band number (optional):")||null;}

function beep(){try{if(navigator.vibrate)navigator.vibrate([200,100,200]);const a=new (window.AudioContext||window.webkitAudioContext)();const o=a.createOscillator();const g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=880;g.gain.value=.25;o.start();setTimeout(()=>{o.frequency.value=660;},150);setTimeout(()=>{o.stop();a.close();},400);}catch{}}

    const label={event_staff:"event staff — gate sign-on, one event, own records",event_admin:"event admin — runs one event: its settings, records, exports, event staff",admin:"admin — all events, all records, create event admins/staff",super_admin:"super admin — everything, create admins",god:"God"};
    let pend=[];try{pend=(await api("/api/invites")).invites;}catch(e){}
    app.innerHTML=tabs+`<div class="card"><h2>Invite someone</h2><p class="hint">Creates a link you copy into an email. They set their own password. Link lasts 7 days.</p><label>Name</label><input id="v_name"><label>Email</label><input id="v_email" type="email"><label>Role</label><select id="v_role" onchange="$('#v_evwrap').style.display=SCOPED(this.value)?'':'none'">${mk.map(r=>`<option value="${r}">${label[r]}</option>`).join("")}</select><div id="v_evwrap"><label>Assign to event (optional)</label><select id="v_event"><option value="">— none yet —</option>${evOpts}</select></div><div class="big"><button class="btn chrome" onclick="createInvite()">Create invite link</button></div>${window._lastInvite?`<div class="alert ok" style="word-break:break-all">${esc(window._lastInvite)}<div style="margin-top:8px"><button class="btn sm" onclick="navigator.clipboard.writeText('${esc(window._lastInvite)}').then(()=>toast('Copied'))">Copy link</button></div></div>`:""}</div>
    ${pend.length?`<div class="card"><h2>Pending invites</h2><table><tr><th>Name</th><th>Role</th><th>Expires</th><th></th></tr>${pend.map(i=>`<tr><td>${esc(i.name)}<div class="hint">${esc(i.email)}</div></td><td>${esc(roleName(i.role))}</td><td>${esc(i.expires_at.slice(0,10))}</td><td style="white-space:nowrap"><button class="btn sm ghost" onclick="navigator.clipboard.writeText(location.origin+'/?invite=${esc(i.token)}').then(()=>toast('Copied'))">Copy</button> <button class="btn sm ghost" style="color:var(--no)" onclick="revokeInvite('${esc(i.token)}')">Revoke</button></td></tr>`).join("")}</table></div>`:""}
    <details class="card"><summary style="font-family:'Barlow Semi Condensed';font-weight:800;font-size:20px;cursor:pointer">Or create a login with a password</summary><label>Name</label><input id="u_name"><label>Email</label><input id="u_email" type="email"><label>Password (8+)</label><input id="u_pass" type="text" autocomplete="off"><label>Role</label><select id="u_role" onchange="$('#u_evwrap').style.display=SCOPED(this.value)?'':'none'">${mk.map(r=>`<option value="${r}">${label[r]}</option>`).join("")}</select><div id="u_evwrap"><label>Assign to event now (optional)</label><select id="u_event"><option value="">— none yet —</option>${evOpts}</select><label>Login expires (optional)</label><input id="u_exp" type="date"></div><div class="big"><button class="btn chrome" onclick="createUser()">Create</button></div><p class="hint">Give them the email and password. Event admins and event staff only see the events they're assigned to — assign more in the table below any time.</p></details>
    <div class="card"><h2>Logins you manage</h2><table><tr><th>Name</th><th>Role</th><th>Events</th><th></th></tr>${us.filter(x=>x.id!==ME.id).map(u=>`<tr><td>${u.training_passed_at?`<span class="tag ok" title="${esc(u.training_track)} · ${esc(u.training_passed_at.slice(0,10))}">✓ trained</span> `:`<span class="tag">no training</span> `}${esc(u.name)}<div class="hint">${esc(u.email)}${u.expires_at?" · expires "+esc(u.expires_at.slice(0,10)):""}${u.active?"":" · <b style='color:var(--no)'>disabled</b>"}</div></td><td><select onchange="patchUser('${u.id}',{role:this.value})">${mk.map(r=>`<option value="${r}" ${r===u.role?"selected":""}>${roleName(r)}</option>`).join("")}</select></td><td>${SCOPED(u.role)?`${(u.events||[]).map(id=>{const e=EVENTS.find(x=>x.id===id);return e?`<span class="tag ok" style="margin:2px 4px 2px 0">${esc(e.code)} <a href="#" onclick="assign('${u.id}','${id}','remove');return false" style="color:inherit;text-decoration:none">✕</a></span>`:"";}).join("")}<select onchange="if(this.value)assign('${u.id}',this.value,'add');this.value=''" style="padding:6px;font-size:14px;width:auto;margin-top:4px"><option value="">+ assign…</option>${EVENTS.filter(e=>!(u.events||[]).includes(e.id)).map(e=>`<option value="${e.id}">${esc(e.code)}</option>`).join("")}</select>`:"all events"}</td><td style="white-space:nowrap"><button class="btn sm ghost" onclick="const p=prompt('New password for ${esc(u.email)}');if(p)patchUser('${u.id}',{password:p})">Pwd</button> <button class="btn sm ghost" onclick="patchUser('${u.id}',{active:${!u.active}})">${u.active?"Disable":"Enable"}</button></td></tr>`).join("")}</table></div>`;
    setTimeout(()=>{const r=$("#u_role");if(r)$("#u_evwrap").style.display=SCOPED(r.value)?"":"none";const v=$("#v_role");if(v)$("#v_evwrap").style.display=SCOPED(v.value)?"":"none";},0);}}
function auditDetail(d){if(!d)return"";if(d.before&&d.after)return Object.keys(d.after).map(k=>`${k}: ${d.before[k]??"—"} -> ${d.after[k]??"—"}`).join("; ")+(d.reason?` (${d.reason})`:"");return Object.entries(d).filter(([k,v])=>v!=null&&v!=="").map(([k,v])=>`${k}: ${typeof v==="object"?JSON.stringify(v):v}`).join("; ");}
function auditCSV(){const log=window._auditLog||[];const rows=[["when","who","action","record_id","event_id","detail"],...log.map(l=>[fmtDT(l.at),l.who_name,l.action,l.sign_on_id||"",l.event_id||"",auditDetail(l.detail)])];dl(new Blob([rows.map(x=>x.map(v=>`"${String(v??"").replace(/"/g,'""')}"`).join(",")).join("\n")],{type:"text/csv"}),`${EV?EV.code:"all"}_audit.csv`);}
async function auditPDF(){const log=window._auditLog||[];const {jsPDF}=window.jspdf;const d=new jsPDF({unit:"mm",format:"a4",orientation:"landscape"});const W=297;const logo=await urlToData("logo.png");
  const head=()=>{d.setFillColor(255);d.rect(0,0,W,20,"F");if(logo){try{d.addImage(logo,"PNG",10,4,34,9);}catch{}}d.setTextColor(20,33,61);d.setFont("helvetica","bold");d.setFontSize(11);d.text("AUDIT TRAIL"+(EV?" · "+EV.name+" ("+EV.code+")":" · all events"),50,12);d.setFont("helvetica","normal");d.setFontSize(8);d.text("Generated "+fmtDT(new Date().toISOString())+" by "+(ME.name||ME.email),W-10,12,{align:"right"});d.setDrawColor(200,16,46);d.setLineWidth(.8);d.line(0,20,W,20);d.setLineWidth(.2);
    let y=28;d.setFont("helvetica","bold");d.setFontSize(8);[["When",10],["Who",42],["Action",75],["Record",95],["Detail",128]].forEach(([t,x])=>d.text(t,x,y));d.setDrawColor(200);d.line(10,y+2,W-10,y+2);return y+7;};
  let y=head();d.setFont("helvetica","normal");d.setFontSize(7.5);
  for(const l of log){const det=d.splitTextToSize(auditDetail(l.detail)||"",W-138);const h=Math.max(5,det.length*3.6);if(y+h>200){d.addPage();y=head();d.setFont("helvetica","normal");d.setFontSize(7.5);}
    d.text(fmtDT(l.at),10,y);d.text(String(l.who_name||"").slice(0,22),42,y);d.text(l.action,75,y);d.text(String(l.sign_on_id||"").slice(0,18),95,y);det.forEach((t,i)=>d.text(t,128,y+i*3.6));y+=h+1.5;}
  d.setTextColor(120);d.setFontSize(7);d.text(`${log.length} entries · Recreation And Competitive Event Resources & Services Pty Ltd ACN 098 088 610`,10,205);dl(d.output("blob"),`${EV?EV.code:"all"}_audit.pdf`);}
async function saveEvent(id){try{const b={id,name:$("#e_name").value,venue:$("#e_venue").value,starts:$("#e_starts").value,ends:$("#e_ends").value,status:$("#e_status").value,passenger_min:$("#e_pmin").value,guardian_under:$("#e_gu").value,waiver_version:$("#e_wv").value,waiver_text:$("#e_wt").value,keep_licence_images:$("#e_keep").checked,wristband_mode:$("#e_wb").value};await api("/api/events",{method:"POST",body:b});window._editEv=null;toast("Saved");await loadEvents();if(EV){EV=EVENTS.find(e=>e.id===EV.id)||EV;await DB.setKV("event",EV);}render();}catch(e){toast(e.message);}}
async function assign(user_id,event_id,action){try{await api("/api/assign",{method:"POST",body:{user_id,event_id,action}});toast(action==="remove"?"Removed":"Assigned");render();}catch(e){toast(e.message);}}
async function createInvite(){try{const role=$("#v_role").value;const j=await api("/api/invites",{method:"POST",body:{name:$("#v_name").value.trim(),email:$("#v_email").value.trim(),role,event_id:SCOPED(role)?($("#v_event").value||null):null}});window._lastInvite=j.link;try{await navigator.clipboard.writeText(j.link);toast("Invite link created and copied");}catch{toast("Invite link created");}render();}catch(e){toast(e.message,5000);}}
async function revokeInvite(t){if(!confirm("Revoke this invite?"))return;try{await api("/api/invites",{method:"DELETE",body:{token:t}});toast("Revoked");render();}catch(e){toast(e.message);}}
async function createUser(){try{const role=$("#u_role").value;const exp=$("#u_exp").value;await api("/api/users",{method:"POST",body:{name:$("#u_name").value,email:$("#u_email").value,password:$("#u_pass").value,role,event_id:SCOPED(role)?($("#u_event").value||null):null,expires_at:exp?exp+"T23:59:59+10:00":null}});toast("Login created");render();}catch(e){toast(e.message);}}
async function patchUser(id,patch){try{await api("/api/users",{method:"PATCH",body:{id,...patch}});toast("Updated");render();}catch(e){toast(e.message);}}

/* ============ public (self / kiosk) ============ */
async function renderPublic(){const app=$("#app");if(!EV){app.innerHTML=`<div class="card"><h2>Loading event…</h2><p class="hint">Code ${esc(PUBCODE)}</p></div>`;try{EV=(await api(`/api/events?code=${encodeURIComponent(PUBCODE)}`)).event;await DB.setKV("pubevent_"+PUBCODE,EV);}catch(e){EV=await DB.getKV("pubevent_"+PUBCODE);if(!EV){app.innerHTML=`<div class="card"><h2>Event not found</h2><p>This sign-on link isn't active. Check with the event organiser.</p></div>`;return;}}$("#evname").textContent=EV.name+(EV.venue?" · "+EV.venue:"");}
  if(VIEW==="cap"){renderCapture();return;}
  const last=MODE==="self"?records.filter(r=>r.qr_token).slice(-1)[0]:null;
  app.innerHTML=`<div class="card"><h2>${esc(EV.name)}</h2><p>${MODE==="kiosk"?"Sign on here, then go to the gate with your licence for your wristband.":"Sign on now on your phone. You'll get a QR pass to show at the gate with your licence."}</p><ol style="padding-left:20px;margin:8px 0"><li>Photo of your licence</li><li>Check your details</li><li>Mobile and email</li><li>Photo of you</li><li>Read and sign the waiver</li></ol><div class="big"><button class="btn chrome" onclick="start('driver')">I'm a DRIVER</button><button class="btn" onclick="start('passenger')">I'm a PASSENGER</button></div>
  ${last?`<p class="hint">Already registered on this phone: <button class="btn sm ghost" onclick='R=records.find(r=>r.id==="${last.id}");STEP=5;VIEW="cap";render()'>show my pass</button></p>`:""}
  <p class="hint">Under ${EV.guardian_under}? A parent or guardian must be with you at the gate. Passengers must be ${EV.passenger_min}+.</p></div>`;}

/* ============ boot ============ */
(async()=>{await DB.open();await loadConfig();SET=(await DB.getKV("settings"))||{device:"DEV-"+Math.random().toString(36).slice(2,6).toUpperCase()};await DB.setKV("settings",SET);records=await DB.all("records");
  if(MODE==="staff"){SESSION=await DB.getKV("session");if(SESSION){await refreshSession();await loadMe();if(ME){await loadEvents();EV=await DB.getKV("event");if(SCOPED(ME.role)&&EVENTS.length===1)EV=EVENTS[0];if(EV&&!EVENTS.find(e=>e.id===EV.id)&&navigator.onLine)EV=null;if(EV)manifest=(await DB.all("manifest")).filter(m=>m.event_id===EV.id);}}}
  render();if(MODE==="staff"&&ME){sync();pollHelp();}})();
</script>
