<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RACERS Sign-On — Training</title>
<link rel="icon" href="favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--orange:#E8891D;--ink:#14213D;--ink2:#1F2F55;--chrome:#FFC72C;--paper:#F3F4F6;--text:#1B1F24;--muted:#5B6470;--line:#D9DDE3;--ok:#1E8E5A;--okbg:#E4F5EC;--no:#C8102E;--nobg:#FCE8EB;--warn:#B7791F;--warnbg:#FFF4D6;--r:8px;--coach:#0b1020}
*{box-sizing:border-box}html,body{margin:0;background:var(--paper);color:var(--text);font-family:"Barlow","Helvetica Neue",Arial,sans-serif;font-size:17px;line-height:1.4}
h1,h2,h3{font-family:"Barlow Semi Condensed","Barlow",sans-serif;margin:0;letter-spacing:-.01em}button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;width:100%;padding:12px;border:1.5px solid var(--line);border-radius:var(--r);background:#fff;color:var(--text);font-size:17px}
label{display:block;font-weight:600;font-size:14px;margin:12px 0 6px}label.inline{display:flex;align-items:center;gap:10px;font-weight:500;font-size:16px;margin:10px 0}label.inline input{width:22px;height:22px;margin:0}
.hint{color:var(--muted);font-size:13px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px 18px;border-radius:var(--r);border:0;font-weight:700;font-size:18px;background:var(--ink);color:#fff}
.btn.chrome{background:var(--chrome);color:var(--ink)}.btn.ghost{background:#fff;border:1.5px solid var(--line);color:var(--text)}.btn.ok{background:var(--ok)}.btn.no{background:var(--no)}.btn.sm{padding:9px 14px;font-size:15px;width:auto}.btn:disabled{opacity:.45}
.top{position:sticky;top:0;z-index:5;background:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.top .b{display:flex;align-items:center;gap:10px;flex:1;min-width:0}.top .b img{height:34px}.top .b small{font-weight:600;font-size:13px;color:var(--muted);display:block}
.top button{background:var(--paper);border:1px solid var(--line);color:var(--text);padding:8px 12px;border-radius:6px;font-weight:700;font-size:14px}
.top .tr{background:var(--warnbg);color:#6b4a00;font-size:12px;font-weight:800;padding:4px 8px;border-radius:999px}
main{padding:18px 16px 190px;max-width:560px;margin:0 auto}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:14px}.card h2{font-size:24px;margin-bottom:6px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:14px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}.stat b{display:block;font-family:"Barlow Semi Condensed";font-size:32px;line-height:1}.stat span{font-size:12px;color:var(--muted);font-weight:600}
.big{display:grid;gap:10px;margin:14px 0}.big .btn{padding:22px;font-size:20px}
.step{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-weight:600;margin-bottom:6px}.prog{height:4px;background:var(--line);border-radius:2px;margin-bottom:16px}.prog i{display:block;height:100%;background:var(--chrome);border-radius:2px}
.imgbox{background:#0b1020;border-radius:12px;aspect-ratio:16/10;display:grid;place-items:center;color:#B9C2D6;overflow:hidden;position:relative;text-align:center}.imgbox.face{aspect-ratio:4/5;max-width:260px;margin:0 auto}.imgbox.sq{aspect-ratio:1/1}
.imgbox .ret{position:absolute;inset:12% 6%;border:2px dashed rgba(255,255,255,.5);border-radius:10px}
.fakecard{background:linear-gradient(135deg,#dfe7f2,#f7f9fc);color:#1B1F24;width:88%;aspect-ratio:1.586;border-radius:10px;padding:10px 12px;text-align:left;font-size:11px;line-height:1.3;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.fakecard b{display:block;font-size:12px;color:#7a1f1f}
.flag{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700;margin:4px 4px 0 0}.flag.ok{background:var(--okbg);color:var(--ok)}.flag.no{background:var(--nobg);color:var(--no)}.flag.warn{background:var(--warnbg);color:var(--warn)}
.alert{padding:12px 14px;border-radius:var(--r);font-weight:600;margin:12px 0;font-size:15px}.alert.no{background:var(--nobg);color:var(--no)}.alert.warn{background:var(--warnbg);color:#6b4a00}.alert.ok{background:var(--okbg);color:var(--ok)}
.waiver{border:1.5px solid var(--line);border-radius:var(--r);background:#fff;max-height:150px;overflow:auto;padding:12px;font-size:14px;white-space:pre-wrap}
.sig{border:2px solid var(--ink);border-radius:var(--r);background:#fff;touch-action:none;width:100%;height:140px;display:block}
.done{min-height:50vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border-radius:16px;padding:24px;color:#fff}.done.ok{background:var(--ok)}.done.no{background:var(--no)}.done.pend{background:var(--orange)}
.done h1{font-size:44px;line-height:1}.done p{font-size:20px;margin:10px 0 0}.done small{opacity:.85;font-size:14px}.done ul{text-align:left;background:rgba(0,0,0,.18);border-radius:10px;padding:12px 16px 12px 32px;margin:16px 0 0;font-size:17px;font-weight:600}
.used{background:var(--no);color:#fff;border-radius:12px;padding:16px;margin-bottom:14px;text-align:center}.used h2{font-size:30px;color:#fff}.used p{margin:6px 0 0;font-weight:600}
.list button.rec{display:flex;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:8px;gap:12px;align-items:center}
.th{width:44px;height:44px;border-radius:8px;background:var(--line);flex:none;display:grid;place-items:center;font-weight:700;color:var(--muted)}
.list .n{font-weight:700}.list .m{font-size:13px;color:var(--muted)}.tag{font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--paper);color:var(--muted);flex:none}.tag.ok{background:var(--okbg);color:var(--ok)}.tag.no{background:var(--nobg);color:var(--no)}.tag.q{background:var(--warnbg);color:var(--warn)}.list .tag{margin-left:auto}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px}.kv span{color:var(--muted)}
.bigphoto{width:100%;max-width:260px;aspect-ratio:4/5;border-radius:12px;background:var(--line);display:grid;place-items:center;margin:0 auto 12px;font-size:60px}
.approve{display:grid;grid-template-columns:1fr 1fr;gap:10px}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
.toast{position:fixed;left:50%;bottom:180px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:8px;font-weight:600;z-index:9;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;text-align:center}.toast.show{opacity:1}
/* coach */
.coach{position:fixed;left:0;right:0;bottom:0;background:var(--coach);color:#fff;padding:14px 16px;padding-bottom:max(14px,env(safe-area-inset-bottom));z-index:8;box-shadow:0 -10px 30px rgba(0,0,0,.35)}
.coach .in{max-width:560px;margin:0 auto}.coach .t{font-size:12px;font-weight:700;color:var(--chrome);letter-spacing:.06em}.coach h3{font-size:19px;margin:2px 0 4px}.coach p{margin:0;font-size:15px;color:#D7DCE8}
.coach .bar{height:4px;background:#2a3554;border-radius:2px;margin:10px 0}.coach .bar i{display:block;height:100%;background:var(--chrome);border-radius:2px;transition:width .3s}
.coach .btns{display:flex;gap:8px;margin-top:8px}.coach .btn{padding:10px 14px;font-size:15px;width:auto}.coach .btn.ghost{background:transparent;border-color:#2a3554;color:#D7DCE8}
.pulse{outline:3px solid var(--chrome);outline-offset:3px;animation:pl 1.2s ease-in-out infinite;border-radius:var(--r)}@keyframes pl{0%,100%{outline-color:var(--chrome)}50%{outline-color:transparent}}
.quiz .opt{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:var(--r);padding:12px;margin:6px 0;font-weight:600}.quiz .opt.right{background:var(--okbg);border-color:var(--ok)}.quiz .opt.wrong{background:var(--nobg);border-color:var(--no)}
.tracks button{display:flex;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:16px;margin-bottom:10px;gap:14px;align-items:center}.tracks b{display:block;font-size:19px;font-family:"Barlow Semi Condensed"}.tracks span{font-size:14px;color:var(--muted)}
</style>
</head>
<body>
<div class="top"><div class="b"><img src="logo.png" alt="RACERS"><div><small id="evname">Training · Lakeside Park</small></div></div><span class="tr">TRAINING — NOT LIVE</span><span id="topbtns"></span></div>
<main id="app"></main>
<div class="toast" id="toast"></div>
<div class="coach" id="coach" style="display:none"><div class="in"><div class="t" id="c_t"></div><h3 id="c_h"></h3><p id="c_p"></p><div class="bar"><i id="c_bar"></i></div><div class="btns"><button class="btn ghost" onclick="coachSkip()">Skip step</button><button class="btn chrome" id="c_next" onclick="coachNext()" disabled>Next</button><button class="btn ghost" style="margin-left:auto" onclick="exitTraining()">Exit</button></div></div></div>
<script>
/* ===== mock data ===== */
const $=s=>document.querySelector(s);const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(m,ms=2400){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),ms);}
const fmtT=d=>new Date(d).toLocaleTimeString("en-AU",{hour:"2-digit",minute:"2-digit"});const fmtDT=d=>new Date(d).toLocaleDateString("en-AU")+" "+fmtT(d);
function age(dob){if(!dob)return null;const b=new Date(dob),n=new Date();let a=n.getFullYear()-b.getFullYear();const m=n.getMonth()-b.getMonth();if(m<0||(m===0&&n.getDate()<b.getDate()))a--;return a;}
const EV={name:"Training · Lakeside Drags",code:"TRAIN-01",venue:"Lakeside Park",passenger_min:16,guardian_under:18,waiver_version:"v1",waiver_text:"ACKNOWLEDGEMENT OF RISK, RELEASE AND WAIVER\n\nMotorised recreational activities are dangerous. By signing I confirm I hold a current licence, am fit to take part, will follow officials' directions, and release RACERS, the Event Organiser and the venue from liability to the extent permitted by law.\n\n(Training copy)"};
let ME={name:"Trainee",role:"event_staff"};
const SAMPLE={first:"KANE",last:"WHITFIELD",dob:"1991-03-14",expiry:"2029-03-14",number:"083612345",state:"QLD",cls:"C",address:"12 SAMPLE ST, STRATHPINE QLD 4500"};
const YOUNG={first:"TAHLIA",last:"MOORE",dob:new Date(Date.now()-17*365.25*864e5).toISOString().slice(0,10),expiry:"2028-06-01",number:"091234567",state:"QLD",cls:"P1",address:"4 EXAMPLE CT, PETRIE QLD 4502"};
let recs=[
 {id:"TRN-0001",type:"driver",source:"self",first_name:"BEC",last_name:"NGUYEN",dob:"1988-07-02",licence_number:"078112233",state:"QLD",class:"C",expiry:"2027-07-02",signed_at:new Date(Date.now()-3600e3).toISOString(),result:"pending",qr:"QR-BEC",flags:[{k:"ok",t:"Licence current"},{k:"ok",t:"Age 38"}],operator:"",approved_at:null,photo:"👩"},
 {id:"TRN-0002",type:"driver",source:"self",first_name:"JARROD",last_name:"PETERSEN",dob:"1979-11-20",licence_number:"066554433",state:"NSW",class:"C",expiry:"2026-05-01",signed_at:new Date(Date.now()-5400e3).toISOString(),result:"pending",qr:"QR-JARROD",flags:[{k:"no",t:"Licence expired"},{k:"ok",t:"Age 46"}],operator:"",approved_at:null,photo:"🧔"},
 {id:"TRN-0003",type:"passenger",source:"kiosk",first_name:"DALE",last_name:"HARRINGTON",dob:"1995-02-11",licence_number:"099887766",state:"QLD",class:"C",expiry:"2030-02-11",signed_at:new Date(Date.now()-7200e3).toISOString(),result:"signed",qr:"QR-DALE",flags:[{k:"ok",t:"Licence current"}],operator:"Gloria",approved_at:new Date(Date.now()-6000e3).toISOString(),photo:"🧑"},
];
let audit=[{at:new Date(Date.now()-6000e3).toISOString(),who:"Gloria",action:"approve",id:"TRN-0003",detail:""}];
let events=[{code:"TRAIN-01",name:"Training · Lakeside Drags",status:"open"}];
let users=[{name:"Mick Apps",email:"mick@example.com",role:"event_staff",events:["TRAIN-01"]}];
let invites=[];

/* ===== tracks & lessons ===== */
const TRACKS={
 event_staff:{label:"Event staff",desc:"Gate sign-on, scanning passes, approving and refusing.",role:"event_staff"},
 event_admin:{label:"Event admin",desc:"Everything above, plus fixing records, event settings, your event's staff and exports.",role:"event_admin"},
 admin:{label:"Admin",desc:"Everything above, plus creating events, assigning event admins and the audit trail.",role:"admin"},
 super_admin:{label:"Super admin / God",desc:"Everything above, plus creating admins and what sits behind the system.",role:"super_admin"},
};
const L={
 home:{t:"Lesson 1 · The home screen",h:"Where you start",p:"Three buttons: SCAN a QR pass for people who signed on themselves, or sign someone on from scratch as a DRIVER or PASSENGER. The tiles count what this phone has done. Tap Next.",done:()=>true},
 gate1:{t:"Lesson 2 · Full gate sign-on",h:"Tap Sign on a DRIVER",p:"A driver walks up with no QR pass. You do the whole sign-on for them.",hl:"#b_driver",done:()=>VIEW==="cap"},
 gate2:{t:"Lesson 2 · Full gate sign-on",h:"Photograph the licence",p:"Tap Open camera. In training the camera is simulated — it 'photographs' a sample card. Then tap Read licence.",done:()=>STEP===1},
 gate3:{t:"Lesson 2 · Full gate sign-on",h:"Check every field — and the face",p:"The reader filled in the details. Compare them with the actual card — it gets things wrong sometimes. And check the person in front of you against the photo on the licence: same face, same person. Flags show anything to worry about. Tap Confirm.",done:()=>STEP===2},
 gate4:{t:"Lesson 2 · Full gate sign-on",h:"Contact, photo, signature",p:"Mobile is required. Take a clear photo of their face — this is what the next official compares against. Hand them the phone to read and sign the waiver, then tap Sign on.",done:()=>VIEW==="cap"&&STEP===5},
 gate5:{t:"Lesson 2 · Full gate sign-on",h:"Green means go",p:"SIGNED ON — you hand them a wristband. The app doesn't issue anything; you do, and only on a green screen. Red screen: no wristband, send them to the RACERS desk to sort it out. Tap Home.",done:()=>VIEW==="home"},
 pass1:{t:"Lesson 3 · Passenger under 18",h:"Tap Sign on a PASSENGER",p:"Passengers get a wristband too. This one is 17.",hl:"#b_pass",done:()=>VIEW==="cap"&&R&&R.type==="passenger"},
 pass2:{t:"Lesson 3 · Passenger under 18",h:"Guardian required",p:"Open camera, Read licence, Confirm. Notice the amber flag: under 18 — guardian required. On the contact screen you must enter the parent/guardian, and they sign as well. Under 16 for a passenger is a hard refuse. Finish the sign-on.",done:()=>VIEW==="cap"&&STEP===5},
 pass3:{t:"Lesson 3 · Passenger under 18",h:"Done",p:"Two signatures, one wristband. Tap Home.",done:()=>VIEW==="home"},
 scan1:{t:"Lesson 4 · Scan a QR pass",h:"Tap SCAN a QR pass",p:"Most people at a big event sign on themselves beforehand and arrive with a QR on their phone.",hl:"#b_scan",done:()=>VIEW==="scan"},
 scan2:{t:"Lesson 4 · Scan a QR pass",h:"Scan Bec's pass",p:"In training, tap the sample pass instead of using the camera. Live, you just point the phone at their screen.",done:()=>VIEW==="approve"&&R&&R.id==="TRN-0001"},
 scan3:{t:"Lesson 4 · Scan a QR pass",h:"Three faces must match",p:"The photo on screen was taken when they registered. Check it against the person in front of you, and both against the photo on their licence card. Three faces, one person. Then check the flags and tap Approve · wristband. If the faces don't match, refuse.",done:()=>recs[0].result==="signed"},
 used1:{t:"Lesson 5 · Used pass",h:"Scan Bec's pass again",p:"Home → SCAN → tap Bec's pass a second time. This is what happens when someone forwards their screenshot to a mate.",done:()=>VIEW==="approve"&&R&&R.id==="TRN-0001"&&recs[0].result==="signed"},
 used2:{t:"Lesson 5 · Used pass",h:"QR ALREADY USED",p:"Red banner, no Approve button, and it tells you who signed them on and when. One pass, one wristband. Tap Back.",done:()=>VIEW!=="approve"},
 ref1:{t:"Lesson 6 · Refusing",h:"Scan Jarrod's pass",p:"Home → SCAN → tap Jarrod's pass.",done:()=>VIEW==="approve"&&R&&R.id==="TRN-0002"},
 ref2:{t:"Lesson 6 · Refusing",h:"Expired licence",p:"Red flag: licence expired. Approve is disabled. Tap Refuse and give a reason. Send them to the RACERS desk — it's not your problem to solve at the gate.",done:()=>recs[1].result==="refused"},
 recs1:{t:"Lesson 7 · Records",h:"Tap Records",p:"Event staff see only the people they signed on or approved. Search by name or licence number. Nothing here can be changed by you.",hl:"#b_records",done:()=>VIEW==="records"},
 off1:{t:"Lesson 8 · No signal",h:"Nothing stops",p:"If the phone loses signal: sign-ons save on the phone and send later; scanning still works because the list of registered people is already on the phone; the licence reader falls back to a simpler one — check the fields carefully. Never wait for signal. Tap Next.",done:()=>true},
 ea1:{t:"Lesson 9 · Fixing a record",h:"Open Records, then open Dale",p:"Event admins can correct a record. Tap Records, then tap Dale Harrington.",hl:"#b_records",done:()=>VIEW==="rec"&&R&&R.id==="TRN-0003"},
 ea2:{t:"Lesson 9 · Fixing a record",h:"Edit details",p:"Tap Edit details, fix the licence number to 099887799, give a reason, save. The old value is kept in the audit log and the record is marked amended.",done:()=>recs[2].licence_number==="099887799"},
 ea3:{t:"Lesson 10 · Deleting",h:"Delete a record",p:"Delete record removes it from the gate and the lists. Nothing is destroyed: admins can still see it, with your name on the deletion. Tap Delete record.",done:()=>recs[2].deleted},
 ea4:{t:"Lesson 11 · Event settings",h:"Tap Admin",p:"Event admins see My event: waiver text and version, passenger minimum age, guardian age, dates, and closing the event. Change the passenger minimum to 18 and Save.",hl:"#b_admin",done:()=>EV.passenger_min===18},
 ea5:{t:"Lesson 12 · Your event's staff",h:"Users tab",p:"Invite someone: name, email, role event staff → Create invite link. Copy it into an email; they set their own password. Then assign existing staff to your event with + assign.",done:()=>invites.length>0},
 ea6:{t:"Lesson 13 · Exports",h:"Records → Export CSV",p:"Event admins export the register (CSV) and every waiver as PDFs. That's what goes to the insurer after the event. Tap Records, then Export CSV.",hl:"#b_records",done:()=>window._exported},
 ad1:{t:"Lesson 14 · Creating events",h:"Admin → Events",p:"Admins create events. The code is generated from the last day — 260927-01 — and it's what goes in the self sign-on link. Create an event called Cruise Night ending next month.",hl:"#b_admin",done:()=>events.length>1},
 ad2:{t:"Lesson 15 · Event admins",h:"Assign an event admin",p:"Users → invite someone as event admin and pick the new event. They'll only ever see that event.",done:()=>invites.some(i=>i.role==="event_admin")},
 ad3:{t:"Lesson 16 · Audit trail",h:"Admin → Audit",p:"Every edit, delete, approval, refusal and assignment with who and when. Download as CSV or PDF. Tick Show deleted in Records to see deleted records.",done:()=>VIEW==="admin"&&adminTab==="audit"},
 sa1:{t:"Lesson 17 · Creating admins",h:"Users → role admin",p:"Super admins create admins (RACERS staff). Nobody can create a role equal to or above their own. Invite someone as admin.",done:()=>invites.some(i=>i.role==="admin")},
 sa2:{t:"Lesson 18 · Behind the system",h:"What God looks after",p:"Hosting (Vercel), database (Supabase, Sydney), the licence-reader key (Anthropic) and the domain. Keys are swapped in Vercel, never in the app. The bootstrap secret is deleted after first use. Tap Next.",done:()=>true},
 quiz:{t:"Check your knowledge",h:"Six questions",p:"80% to pass.",done:()=>false},
};
const ORDER={event_staff:["home","gate1","gate2","gate3","gate4","gate5","pass1","pass2","pass3","scan1","scan2","scan3","used1","used2","ref1","ref2","recs1","off1","quiz"]};
ORDER.event_admin=[...ORDER.event_staff.slice(0,-1),"ea1","ea2","ea3","ea4","ea5","ea6","quiz"];
ORDER.admin=[...ORDER.event_admin.slice(0,-1),"ad1","ad2","ad3","quiz"];
ORDER.super_admin=[...ORDER.admin.slice(0,-1),"sa1","sa2","quiz"];
const QUIZ=[
 {q:"The sign-on screen goes red. What do you do?",o:["Hand over the wristband anyway if they have a licence","No wristband. Send them to the RACERS desk to sort it out","Try scanning again until it goes green"],a:1},
 {q:"Someone shows a QR that comes up 'ALREADY USED'. Why?",o:["The phone has lost signal","That pass was already scanned — one pass, one wristband","The camera needs cleaning"],a:1},
 {q:"The reader fills in the licence details. Your job on the confirm screen is to…",o:["Tap Confirm — the reader is always right","Compare every field with the actual licence card","Retype everything"],a:1},
 {q:"A 17-year-old passenger wants to sign on.",o:["Refuse — passengers must be 18","Sign on with a parent/guardian present and signing","Only if they have a P plate"],a:1},
 {q:"A QR pass comes up with a photo. Who do you compare it with?",o:["Nobody — the photo is just for the record","The person in front of you AND the photo on their licence card","The name on the wristband"],a:1},
 {q:"The phone has no signal at the gate.",o:["Stop and wait for signal","Keep going — sign-ons queue and scanning works from the list already on the phone","Write names on paper instead"],a:1},
];

/* ===== coach ===== */
let TRACK=null,IDX=0,VIEW="tracks",R=null,STEP=0,adminTab="events",qi=0,qs=0,LOGIN=null;
const RK={event_staff:1,event_admin:2,admin:3,super_admin:4,god:4};
function readLogin(){return new Promise(res=>{try{const r=indexedDB.open("racers-signon-v2",1);r.onsuccess=e=>{const d=e.target.result;try{const t=d.transaction("kv","readonly").objectStore("kv").get("me");t.onsuccess=()=>res(t.result||null);t.onerror=()=>res(null);}catch{res(null);}};r.onerror=()=>res(null);}catch{res(null);}});}
function startTrack(k){TRACK=k;IDX=0;ME={name:"Trainee",role:TRACKS[k].role};VIEW="home";$("#coach").style.display="";render();coachShow();}
function exitTraining(){TRACK=null;VIEW="tracks";$("#coach").style.display="none";render();}
function coachShow(){const key=ORDER[TRACK][IDX];const l=L[key];$("#c_t").textContent=l.t;$("#c_h").textContent=l.h;$("#c_p").textContent=l.p;$("#c_bar").style.width=Math.round(IDX/(ORDER[TRACK].length-1)*100)+"%";document.querySelectorAll(".pulse").forEach(e=>e.classList.remove("pulse"));if(l.hl){const el=$(l.hl);if(el)el.classList.add("pulse");}$("#c_next").disabled=!l.done();if(key==="quiz"){VIEW="quiz";qi=0;qs=0;render();}}
function coachCheck(){if(!TRACK)return;const l=L[ORDER[TRACK][IDX]];const ok=l.done();$("#c_next").disabled=!ok;if(ok){$("#c_next").textContent="Next ✓";}else $("#c_next").textContent="Next";if(l.hl){const el=$(l.hl);if(el&&!ok)el.classList.add("pulse");}}
function coachNext(){if(IDX<ORDER[TRACK].length-1){IDX++;coachShow();coachCheck();}}
function coachSkip(){coachNext();}

/* ===== app views ===== */
function topButtons(){const t=$("#topbtns");if(!TRACK){t.innerHTML="";return;}const rk={event_staff:1,event_admin:2,admin:3,super_admin:4};t.innerHTML=`<button onclick="nav('home')">Home</button><button id="b_records" onclick="nav('records')">Records</button>${rk[ME.role]>=2?`<button id="b_admin" onclick="nav('admin')">Admin</button>`:""}`;}
function nav(v){VIEW=v;render();}
function render(){topButtons();const app=$("#app");
 if(VIEW==="tracks"){const max=LOGIN?RK[LOGIN.role]||1:1;app.innerHTML=`<div class="card"><h2>RACERS Sign-On training</h2><p>${LOGIN?`Logged in as ${esc(LOGIN.name||LOGIN.email)} (${esc(LOGIN.role==="god"?"God":LOGIN.role.replace("_"," "))}).`:"Not logged in — event staff training only. Log in to the app on this device to see your level."} Each track includes everything below it. Nothing you do here is real — fake people, fake event, nothing saved.</p></div><div class="tracks">${Object.entries(TRACKS).filter(([k])=>RK[k]<=max).map(([k,t])=>`<button onclick="startTrack('${k}')"><div><b>${t.label}</b><span>${t.desc}</span></div><span style="margin-left:auto;font-size:22px">→</span></button>`).join("")}</div>`;return;}
 if(VIEW==="home"){const mine=recs.filter(r=>r.operator==="Trainee");app.innerHTML=`<div class="stats"><div class="stat"><b>${mine.filter(r=>r.type==="driver").length}</b><span>Drivers (this device)</span></div><div class="stat"><b>${mine.filter(r=>r.type==="passenger").length}</b><span>Passengers</span></div><div class="stat"><b>${recs.filter(r=>r.result==="pending"&&!r.deleted).length}</b><span>Pending approval</span></div></div>
  <div class="big"><button class="btn" id="b_scan" onclick="nav('scan')">SCAN a QR pass</button><button class="btn chrome" id="b_driver" onclick="start('driver')">Sign on a DRIVER</button><button class="btn" id="b_pass" onclick="start('passenger')">Sign on a PASSENGER</button></div>
  <div class="card"><h2 style="font-size:18px">Self sign-on link for this event</h2><input readonly value="https://racelicence.com/?e=${EV.code}"><p class="hint">Logged in as Trainee (${ME.role.replace("_"," ")}) · device TRAIN</p></div>`;}
 else if(VIEW==="cap")renderCap();
 else if(VIEW==="scan"){app.innerHTML=`<div class="imgbox sq"><div class="ret"></div><div>Camera (simulated)<br><small>tap a sample pass below</small></div></div><p class="hint" style="margin:10px 0;font-weight:700">Sample passes</p><div class="list">${recs.filter(r=>r.source!=="gate"&&!r.deleted).map(r=>`<button class="rec" onclick="scan('${r.id}')"><span class="th">${r.photo}</span><div><div class="n">${r.first_name} ${r.last_name}</div><div class="m">${r.qr} · ${r.type}</div></div><span class="tag ${r.result==="signed"?"ok":r.result==="refused"?"no":"q"}">${r.result}</span></button>`).join("")}</div><div class="big"><button class="btn ghost" onclick="nav('home')">Cancel</button></div>`;}
 else if(VIEW==="approve"){const m=R;const used=m.result!=="pending";app.innerHTML=`${used?`<div class="used"><h2>${m.result==="signed"?"QR ALREADY USED":"PASS REFUSED"}</h2><p>${m.result==="signed"?"Signed on "+fmtDT(m.approved_at)+" by "+m.operator+". Wristband already issued — do not issue another.":"Refused · "+(m.refusal_reason||"")}</p></div>`:""}<div class="card"><div class="bigphoto">${m.photo}</div><h2>${m.first_name} ${m.last_name}</h2><p class="hint">${m.type} · ${m.source} · ${m.licence_number} ${m.state} class ${m.class}</p><div class="kv"><span>DOB</span><b>${m.dob} (age ${age(m.dob)})</b><span>Expiry</span><b>${m.expiry}</b><span>Waiver</span><b>Signed ${fmtDT(m.signed_at)}</b></div><div>${m.flags.map(f=>`<span class="flag ${f.k}">${f.t}</span>`).join("")}</div><p class="hint" style="margin-top:12px">Compare the photo above with the person in front of you and with the photo on their licence card. Three faces, one person. Then approve.</p></div>${used?"":`<div class="approve"><button class="btn no" onclick="decide('refuse')">Refuse</button><button class="btn ok" ${m.flags.some(f=>f.k==="no")?"disabled":""} onclick="decide('approve')">Approve · wristband</button></div>`}<div class="big"><button class="btn ghost" onclick="nav('home')">Back</button></div>`;}
 else if(VIEW==="records"){const rk={event_staff:1,event_admin:2,admin:3,super_admin:4}[ME.role];const rows=recs.filter(r=>(rk>=2||r.operator==="Trainee")&&(window._showDel||!r.deleted));app.innerHTML=`<input placeholder="Search name or licence number"><div style="display:flex;gap:8px;margin:12px 0;flex-wrap:wrap">${rk>=2?`<button class="btn sm ghost" onclick="window._exported=true;toast('Register CSV downloaded (simulated)');coachCheck()">Export CSV</button><button class="btn sm ghost" onclick="toast('PDF zip downloaded (simulated)')">Export PDFs (zip)</button>`:""}${rk>=3?`<label class="inline" style="margin:0 0 0 auto;font-size:14px"><input type="checkbox" ${window._showDel?"checked":""} onchange="window._showDel=this.checked;render()">Show deleted</label>`:""}</div><div class="list">${rows.map(r=>`<button class="rec" onclick="openRec('${r.id}')"><span class="th">${r.photo||"👤"}</span><div><div class="n">${r.first_name} ${r.last_name}</div><div class="m">${r.licence_number} · ${r.state}</div></div><span class="tag">${r.type}</span>${r.deleted?`<span class="tag no">deleted</span>`:r.amended?`<span class="tag q">amended</span>`:r.result==="refused"?`<span class="tag no">refused</span>`:r.result==="pending"?`<span class="tag q">pending</span>`:""}</button>`).join("")||`<p class="hint">No records yet — event staff only see their own.</p>`}</div>`;}
 else if(VIEW==="rec"){const r=R;const rk={event_staff:1,event_admin:2,admin:3,super_admin:4}[ME.role];app.innerHTML=`<div class="card"><h2>${r.first_name} ${r.last_name}</h2><p class="hint">${r.type} · ${r.source} · ${r.operator||"—"}</p><div class="kv" style="margin-top:12px"><span>Licence</span><b>${r.licence_number} · ${r.state} · ${r.class}</b><span>DOB</span><b>${r.dob}</b><span>Result</span><b>${r.result}</b>${r.amended?`<span>Amended</span><b style="color:var(--warn)">${fmtDT(r.amended)} · Trainee</b>`:""}${r.deleted?`<span>Deleted</span><b style="color:var(--no)">${fmtDT(r.deleted)} · Trainee</b>`:""}</div></div><div class="row"><button class="btn ghost" onclick="nav('records')">Back</button>${rk>=2?`<button class="btn" onclick="toast('PDF opened (simulated)')">Open PDF</button>`:""}</div>${rk>=2&&!r.deleted?`<div style="display:flex;gap:8px;margin-top:14px"><button class="btn sm ghost" onclick="nav('edit')">Edit details</button><button class="btn sm ghost" style="color:var(--no)" onclick="delRec()">Delete record</button></div>`:""}`;}
 else if(VIEW==="edit"){const r=R;app.innerHTML=`<div class="card"><h2>Edit record</h2><p class="hint">Original values are kept in the audit log.</p><label>Licence no.</label><input id="x_num" value="${r.licence_number}"><label>Reason for change</label><input id="x_reason" placeholder="e.g. misread at gate"></div><div class="row"><button class="btn ghost" onclick="nav('rec')">Cancel</button><button class="btn chrome" onclick="saveEdit()">Save changes</button></div>`;}
 else if(VIEW==="admin")renderAdmin();
 else if(VIEW==="quiz")renderQuiz();
 setTimeout(coachCheck,0);}
function start(type){R={type,first:"",last:"",dob:"",expiry:"",number:"",state:"",cls:"",address:"",phone:"",email:"",licenceImg:false,photo:false,guardianName:"",guardianPhone:"",flags:[],result:""};STEP=0;nav("cap");}
function stepbar(n,t){const p=[10,30,50,70,90,100][n];return `<div class="step"><span>${R.type==="passenger"?"PASSENGER":"DRIVER"} · ${t}</span><span>${n+1} of 5</span></div><div class="prog"><i style="width:${p}%"></i></div>`;}
function checks(){const fl=[];const a=age(R.dob);if(R.expiry&&new Date(R.expiry)<new Date())fl.push({k:"no",t:"Licence expired"});else fl.push({k:"ok",t:"Licence current"});if(a!==null){if(R.type==="passenger"&&a<EV.passenger_min)fl.push({k:"no",t:`Under ${EV.passenger_min} — refuse`});else if(a<EV.guardian_under)fl.push({k:"warn",t:`Under ${EV.guardian_under} — guardian required`});else fl.push({k:"ok",t:`Age ${a}`});}if(/^P/.test(R.cls))fl.push({k:"warn",t:"Provisional"});return fl;}
function renderCap(){const app=$("#app");const s=R.type==="passenger"?YOUNG:SAMPLE;
 if(STEP===0)app.innerHTML=stepbar(0,"Licence")+`<div class="imgbox">${R.licenceImg?`<div class="fakecard"><b>QUEENSLAND DRIVER LICENCE</b>${s.last}<br>${s.first}<br>${s.address}<br>DOB ${s.dob} · No ${s.number}<br>Class ${s.cls} · Expiry ${s.expiry}</div>`:`<div class="ret"></div><div>Photograph the front of the licence<br><small>simulated camera</small></div>`}</div><div class="big">${R.licenceImg?`<button class="btn chrome" onclick="Object.assign(R,SAMPLE,s2());STEP=1;render()">Read licence</button>`:`<button class="btn chrome" onclick="R.licenceImg=true;render()">Open camera</button><button class="btn ghost" onclick="STEP=1;render()">Skip — type it in</button>`}<button class="btn ghost" onclick="nav('home')">Cancel</button></div>`;
 else if(STEP===1){const fl=checks();app.innerHTML=stepbar(1,"Check the details")+`<div class="card"><p class="hint" style="margin:0 0 6px">Check every field against the licence. Fix anything the reader got wrong.</p><div class="row"><div><label>First name(s)</label><input id="f_first" value="${R.first}"></div><div><label>Last name</label><input id="f_last" value="${R.last}"></div></div><div class="row"><div><label>Date of birth</label><input id="f_dob" type="date" value="${R.dob}"></div><div><label>Licence expiry</label><input type="date" value="${R.expiry}"></div></div><div class="row"><div><label>Licence number</label><input value="${R.number}"></div><div><label>State</label><input value="${R.state}"></div></div><div class="row"><div><label>Class</label><input value="${R.cls}"></div><div><label>Age</label><input value="${age(R.dob)??""}" readonly></div></div><label>Address</label><input value="${R.address}"><div>${fl.map(f=>`<span class="flag ${f.k}">${f.t}</span>`).join("")}</div></div><div class="row"><button class="btn ghost" onclick="STEP=0;render()">Back</button><button class="btn chrome" onclick="R.flags=checks();STEP=2;render()">Confirm</button></div>`;}
 else if(STEP===2){const needG=age(R.dob)<EV.guardian_under;app.innerHTML=stepbar(2,"Contact")+`<div class="card"><label>Mobile</label><input id="f_phone" value="${R.phone}" placeholder="04.."><label>Email</label><input value="${R.email}">${needG?`<div class="alert warn">Under ${EV.guardian_under} — parent or guardian must be present and sign.</div><label>Parent / guardian name</label><input id="f_gname" value="${R.guardianName}"><label>Parent / guardian mobile</label><input value="${R.guardianPhone}">`:""}</div><div class="row"><button class="btn ghost" onclick="STEP=1;render()">Back</button><button class="btn chrome" onclick="R.phone=$('#f_phone').value.trim();const g=$('#f_gname');if(g){R.guardianName=g.value.trim();if(!R.guardianName){toast('Guardian name required');return;}}if(!R.phone){toast('Mobile is required');return;}STEP=3;render()">Continue</button></div>`;}
 else if(STEP===3)app.innerHTML=stepbar(3,"Photo")+`<div class="imgbox face">${R.photo?"🧑":"Photo of the person"}</div><div class="big"><button class="btn chrome" onclick="R.photo=true;render()">${R.photo?"Retake":"Take photo"}</button></div><div class="row"><button class="btn ghost" onclick="STEP=2;render()">Back</button><button class="btn" ${R.photo?"":"disabled"} onclick="STEP=4;render()">Continue</button></div>`;
 else if(STEP===4){const needG=age(R.dob)<EV.guardian_under;app.innerHTML=stepbar(4,"Sign")+`<div class="card"><h2 style="font-size:18px">${R.first} ${R.last} — read and sign</h2><div class="waiver">${esc(EV.waiver_text)}</div><label>Signature of ${R.first} ${R.last}</label><canvas class="sig" id="sig"></canvas>${needG?`<label>Signature of parent / guardian ${R.guardianName}</label><canvas class="sig" id="gsig"></canvas>`:""}</div><div class="row"><button class="btn ghost" onclick="STEP=3;render()">Back</button><button class="btn ok" onclick="finish()">Sign on</button></div>`;setTimeout(()=>{initSig("sig");if(needG)initSig("gsig");},0);}
 else if(STEP===5){const ok=R.result==="signed";app.innerHTML=`<div class="done ${ok?"ok":"no"}"><h1>${ok?"SIGNED ON":"REFUSED"}</h1><p>${R.first} ${R.last}</p>${ok?`<small>${R.type==="passenger"?"Issue passenger wristband":"Issue wristband"}</small>`:`<ul>${R.flags.filter(f=>f.k==="no").map(f=>`<li>${f.t}</li>`).join("")}</ul>`}</div><div class="big"><button class="btn chrome" onclick="start('${R.type}')">Next ${R.type}</button><button class="btn ghost" onclick="nav('home')">Home</button></div>`;}}
function s2(){return R.type==="passenger"?YOUNG:SAMPLE;}
const PADS={};function initSig(id){const c=document.getElementById(id);if(!c)return;const dpr=devicePixelRatio||1;c.width=c.clientWidth*dpr;c.height=c.clientHeight*dpr;const x=c.getContext("2d");x.scale(dpr,dpr);x.lineWidth=2.4;x.lineCap="round";x.strokeStyle="#14213D";let d=false,used=false;const pt=e=>{const r=c.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top];};c.onpointerdown=e=>{d=true;used=true;c.setPointerCapture(e.pointerId);x.beginPath();x.moveTo(...pt(e));};c.onpointermove=e=>{if(!d)return;x.lineTo(...pt(e));x.stroke();};c.onpointerup=()=>{d=false;};PADS[id]={get used(){return used;}};}
function finish(){if(!PADS.sig||!PADS.sig.used){toast("Signature required");return;}if(PADS.gsig&&!PADS.gsig.used){toast("Guardian signature required");return;}const hard=R.flags.filter(f=>f.k==="no");R.result=hard.length?"refused":"signed";const id="TRN-"+String(recs.length+1).padStart(4,"0");recs.push({id,type:R.type,source:"gate",first_name:R.first,last_name:R.last,dob:R.dob,licence_number:R.number,state:R.state,class:R.cls,expiry:R.expiry,signed_at:new Date().toISOString(),result:R.result,qr:"QR-"+id,flags:R.flags,operator:"Trainee",approved_at:new Date().toISOString(),photo:"🧑"});audit.push({at:new Date().toISOString(),who:"Trainee",action:R.result==="signed"?"create":"refuse",id,detail:R.type});STEP=5;render();}
function scan(id){R=recs.find(r=>r.id===id);nav("approve");}
function decide(a){const m=R;if(a==="refuse"){const reason=prompt("Reason for refusal:","Licence expired")||"Refused at gate";m.result="refused";m.refusal_reason=reason;}else{m.result="signed";}m.operator="Trainee";m.approved_at=new Date().toISOString();audit.push({at:m.approved_at,who:"Trainee",action:a,id:m.id,detail:m.refusal_reason||""});R={type:m.type,first:m.first_name,last:m.last_name,result:m.result,flags:[{k:"no",t:m.refusal_reason||""}]};STEP=5;VIEW="cap";render();}
function openRec(id){R=recs.find(r=>r.id===id);nav("rec");}
function saveEdit(){const v=$("#x_num").value.trim();const reason=$("#x_reason").value.trim();if(!reason){toast("Give a reason for the change");return;}audit.push({at:new Date().toISOString(),who:"Trainee",action:"edit",id:R.id,detail:`licence_number: ${R.licence_number} → ${v} (${reason})`});R.licence_number=v;R.amended=new Date().toISOString();toast("Saved");nav("rec");}
function delRec(){R.deleted=new Date().toISOString();audit.push({at:R.deleted,who:"Trainee",action:"delete",id:R.id,detail:"Deleted by Trainee"});toast("Deleted");nav("records");}
function renderAdmin(){const app=$("#app");const rk={event_staff:1,event_admin:2,admin:3,super_admin:4}[ME.role];const tabs=`<div style="display:flex;gap:8px;margin-bottom:14px"><button class="btn sm ${adminTab==="events"?"":"ghost"}" onclick="adminTab='events';render()">${rk>=3?"Events":"My event"}</button><button class="btn sm ${adminTab==="users"?"":"ghost"}" onclick="adminTab='users';render()">Users</button>${rk>=3?`<button class="btn sm ${adminTab==="audit"?"":"ghost"}" onclick="adminTab='audit';render()">Audit</button>`:""}</div>`;
 if(adminTab==="events"){app.innerHTML=tabs+`<div class="card"><h2>${rk>=3?"New event":"My event"}</h2>${rk>=3?`<label>Name</label><input id="e_name" placeholder="Cruise Night"><label>Ends (sets the code)</label><input id="e_ends" type="date"><div class="big"><button class="btn chrome" onclick="createEvent()">Save</button></div><hr>`:""}<h3 style="font-size:18px;margin-top:8px">${EV.name} <span class="hint">${EV.code}</span></h3><div class="row"><div><label>Passenger min age</label><input id="e_pmin" type="number" value="${EV.passenger_min}"></div><div><label>Guardian under</label><input id="e_gu" type="number" value="${EV.guardian_under}"></div></div><label>Waiver version</label><input value="${EV.waiver_version}"><label>Waiver text</label><textarea rows="4">${esc(EV.waiver_text)}</textarea><label>Status</label><select><option>open</option><option>closed</option></select><div class="big"><button class="btn chrome" onclick="EV.passenger_min=+$('#e_pmin').value;EV.guardian_under=+$('#e_gu').value;toast('Saved');render()">Save</button></div></div>${rk>=3?`<div class="card"><h2>Events</h2><table><tr><th>Code</th><th>Name</th><th>Status</th></tr>${events.map(e=>`<tr><td>${e.code}</td><td>${e.name}</td><td><span class="tag ok">${e.status}</span></td></tr>`).join("")}</table></div>`:""}`;}
 else if(adminTab==="users"){const mk=["event_staff","event_admin","admin","super_admin"].slice(0,rk-1);app.innerHTML=tabs+`<div class="card"><h2>Invite someone</h2><p class="hint">Creates a link you copy into an email. They set their own password.</p><label>Name</label><input id="v_name"><label>Email</label><input id="v_email"><label>Role</label><select id="v_role">${mk.map(r=>`<option value="${r}">${r.replace("_"," ")}</option>`).join("")}</select><label>Assign to event</label><select id="v_event">${events.map(e=>`<option>${e.code}</option>`).join("")}</select><div class="big"><button class="btn chrome" onclick="createInvite()">Create invite link</button></div>${window._lastInvite?`<div class="alert ok" style="word-break:break-all">${window._lastInvite}<div style="margin-top:8px"><button class="btn sm" onclick="toast('Copied')">Copy link</button></div></div>`:""}</div>${invites.length?`<div class="card"><h2>Pending invites</h2><table><tr><th>Name</th><th>Role</th><th></th></tr>${invites.map(i=>`<tr><td>${i.name}<div class="hint">${i.email}</div></td><td>${i.role.replace("_"," ")}</td><td><button class="btn sm ghost">Copy</button></td></tr>`).join("")}</table></div>`:""}<div class="card"><h2>Logins you manage</h2><table><tr><th>Name</th><th>Role</th><th>Events</th></tr>${users.map(u=>`<tr><td>${u.name}<div class="hint">${u.email}</div></td><td>${u.role.replace("_"," ")}</td><td>${u.events.map(e=>`<span class="tag ok">${e} ✕</span>`).join(" ")} <select style="width:auto;padding:4px;font-size:13px" onchange="if(this.value){users[0].events.push(this.value);toast('Assigned');render()}"><option value="">+ assign…</option>${events.filter(e=>!u.events.includes(e.code)).map(e=>`<option>${e.code}</option>`).join("")}</select></td></tr>`).join("")}</table></div>`;}
 else{app.innerHTML=tabs+`<div class="card"><h2>Audit trail</h2><p class="hint">Every edit, delete, approval, refusal and assignment. Nothing here can be removed.</p><div style="display:flex;gap:8px;margin-bottom:12px"><button class="btn sm ghost" onclick="toast('CSV downloaded (simulated)')">Download CSV</button><button class="btn sm ghost" onclick="toast('PDF downloaded (simulated)')">Download PDF</button></div><table><tr><th>When</th><th>Who</th><th>Action</th><th>Record</th><th>Detail</th></tr>${[...audit].reverse().map(l=>`<tr><td>${fmtT(l.at)}</td><td>${l.who}</td><td><span class="tag ${l.action==="delete"?"no":l.action==="edit"?"q":l.action==="approve"?"ok":""}">${l.action}</span></td><td>${l.id}</td><td>${esc(l.detail)}</td></tr>`).join("")}</table></div>`;}}
function createEvent(){const n=$("#e_name").value.trim();const e=$("#e_ends").value;if(!n||!e){toast("Name and end date required");return;}const day=e.replace(/-/g,"").slice(2,8);const same=events.filter(x=>x.code.startsWith(day+"-")).length+1;events.push({code:`${day}-${String(same).padStart(2,"0")}`,name:n,status:"open"});toast("Event created");render();}
function createInvite(){const n=$("#v_name").value.trim(),em=$("#v_email").value.trim(),role=$("#v_role").value;if(!n||!em){toast("Name and email required");return;}const t=Math.random().toString(36).slice(2,10);invites.push({name:n,email:em,role,event:$("#v_event").value});window._lastInvite=`https://racelicence.com/?invite=${t}${t}`;toast("Invite link created and copied");render();}
function renderQuiz(){const app=$("#app");if(qi>=QUIZ.length){const pct=Math.round(qs/QUIZ.length*100);const pass=pct>=80;app.innerHTML=`<div class="done ${pass?"ok":"no"}"><h1>${pct}%</h1><p>${pass?"Passed — you're ready for the gate.":"Not yet — go through the track again."}</p><small>${qs} of ${QUIZ.length} correct · ${TRACKS[TRACK].label} track</small></div><div class="big"><button class="btn chrome" onclick="exitTraining()">Back to tracks</button><button class="btn ghost" onclick="startTrack('${TRACK}')">Run the track again</button></div>`;$("#c_bar").style.width="100%";return;}
 const q=QUIZ[qi];app.innerHTML=`<div class="card quiz"><p class="hint">Question ${qi+1} of ${QUIZ.length}</p><h2 style="font-size:20px">${q.q}</h2>${q.o.map((o,i)=>`<button class="opt" id="opt${i}" onclick="answer(${i})">${o}</button>`).join("")}<div id="qnext"></div></div>`;}
function answer(i){const q=QUIZ[qi];document.querySelectorAll(".opt").forEach(b=>b.disabled=true);$("#opt"+i).classList.add(i===q.a?"right":"wrong");$("#opt"+q.a).classList.add("right");if(i===q.a)qs++;$("#qnext").innerHTML=`<div class="big"><button class="btn chrome" onclick="qi++;renderQuiz()">${qi+1<QUIZ.length?"Next question":"See result"}</button></div>`;}
readLogin().then(m=>{LOGIN=m;render();});
</script>
